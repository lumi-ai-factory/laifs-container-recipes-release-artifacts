  cf_hash: f3a2a6f30859dad3e48727b24055b40c70c4071c
  cf_lineage: 47b20f78942bf7924132a14efa03deb9f981dded,399b53a392da96694e61eedfb68f5bda0a4d03da,f006cf1fb2e3235dfcc4da0368c4aa7b3bed7b2b,f3a2a6f30859dad3e48727b24055b40c70c4071c
  cf_text: "ARG BASE_IMAGE=lumi-multitorch-mpich-u24r64f21m43t29\nARG TORCH_VERSION=2.9.1\n\
    ARG PYTORCH_TRITON_URL=https://download.pytorch.org/whl/pytorch_triton_rocm-3.5.1-cp312-cp312-linux_x86_64.whl\n\
    ARG FAKE_TRITON_URL=git+https://github.com/viahlgre/fake-triton.git@a8412a9\n\
    ARG TORCHAUDIO_URL=https://download.pytorch.org/whl/rocm6.4/torchaudio-2.9.1%2Brocm6.4-cp312-cp312-manylinux_2_28_x86_64.whl\n\
    ARG TORCHVISION_URL=https://download.pytorch.org/whl/rocm6.4/torchvision-0.24.1%2Brocm6.4-cp312-cp312-manylinux_2_28_x86_64.whl\n\
    ARG TORCH_URL=https://download.pytorch.org/whl/rocm6.4/torch-2.9.1%2Brocm6.4-cp312-cp312-manylinux_2_28_x86_64.whl\n\
    \nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\nARG BASE_IMAGE\nARG BASE_IMAGE_TAG\nARG\
    \ PYTORCH_TRITON_URL\nARG FAKE_TRITON_URL\nARG TORCHAUDIO_URL\nARG TORCHVISION_URL\n\
    ARG TORCH_URL\n\nRUN set -ue; \\\n  #\n  # Create new venv and install Pytorch\n\
    \  #\n  python3.12 -m venv /opt/venv; \\\n  . /opt/venv/bin/activate; \\\n  pip\
    \ install $PYTORCH_TRITON_URL $TORCHAUDIO_URL $TORCHVISION_URL $TORCH_URL $FAKE_TRITON_URL\
    \ patchelf; \\\n  pip cache purge; \\\n  # Patch torch to prefer system rocm\n\
    \  patchelf --set-rpath '/opt/rocm/lib:/usr/lib:$ORIGIN' /opt/venv/lib/python3.12/site-packages/torch/lib/libtorch_hip.so;\
    \ \\\n  #\n  # Add SBOM\n  #\n  apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\\
    n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version:\
    \ .[1]})')\"; \\\n  pip_json=\"$(pip list --format=json)\"; \\\n  jq -n --argjson\
    \ apt \"$apt_json\"  --argjson pip \"$pip_json\" '{apt: $apt, pip: $pip}' > /.sbom.json;\n\
    \nENV PATH=\"/opt/venv/bin:$PATH\"\nENV PYTHONPATH=\"/opt/venv/lib/python3.12/site-packages:$PYTHONPATH\"\
    \n\nCMD [\"/bin/bash\"]\n"
- name: lumi-multitorch-full-u24r64f21m43t29
  base: lumi-multitorch-torch-u24r64f21m43t29
  desc: |
    **Overview**
    This is a multipurpose ML/AI image that builds on its base image by adding a
    comprehensive selection of tools and libraries for machine learning and AI
    workloads. The image is optimized to run on LUMI but should also work on other
    systems with MI250x GPUs and Slingshot interconnect.

    **Details**
    Base image: lumi-multitorch-torch-u24r64f21m43t29
    GPU architectures: gfx90a
    Components:
      - Apex (from https://github.com/ROCm/apex commit e37ed12)
      - Causal Conv1D (from https://github.com/Dao-AILab/causal-conv1d commit 0d2252d)
      - DeepSpeed 0.18.8 (with locally built ops addons)
      - Flash Attention (from https://github.com/ROCm/flash-attention commit bbe25ba)
      - LLM Compressor: (from https://github.com/vllm-project/llm-compressor commit 6a6cfec)
      - Megatron LM (experimental): (from https://github.com/viahlgre/Megatron-LM commit c333868)
      - vLLM v0.16.0 (from https://github.com/vllm-project/vllm commit 89a77b1)
      - xFormers (from https://github.com/facebookresearch/xformers commit 41531ce)

    Additional Python packages from PyPI:
      - accelerate
      - bitsandbytes
      - datasets
      - evaluate
      - huggingface-hub
      - jupyter
      - lightning
      - matplotlib
      - mpi4py
      - numba
      - numpy
