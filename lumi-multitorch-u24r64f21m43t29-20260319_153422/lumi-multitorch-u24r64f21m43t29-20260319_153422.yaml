    ; \\\n    dpkg -i libcxi_${LIBCXI_VERSION}_amd64.deb;\n\nRUN set -ue; \\\n   \
    \ #\n    # Libfabric\n    #\n    TMPROOT=$(mktemp -d); \\\n    install -d \"$TMPROOT/src\"\
    \ \"$TMPROOT/usr\"; \\\n    git clone ${LIBFABRIC_CLONE_URL} \"$TMPROOT/src/libfabric\"\
    ; \\\n    cd \"$TMPROOT/src/libfabric\"; \\\n    git checkout \"${LIBFABRIC_GIT_COMMIT}\"\
    ; \\\n    ./autogen.sh; \\\n    ./configure LDFLAGS=-Wl,--build-id --prefix=/usr\
    \ --enable-only --enable-rxm  --enable-rxd --enable-shm --enable-hook_hmem --enable-dmabuf_peer_mem\
