- name: lumi-multitorch-mpich-u24r64f21m43t29
  base: lumi-multitorch-libfabric-u24r64f21m43t29
  desc: |
    **Overview**
    This image builds on top of its base image by adding an MPI library with GPU
    support, based on an MPICH build. It also includes the AWS-OFI-RCCL plugin to
    enable RCCL communication over the interconnect network using libfabric. The
    rccl-tests and OSU micro-benchmarks suite are included for performance and
    functionality validation.

    **Details**
    Base image: lumi-multitorch-libfabric-u24r64f21m43t29
    MPI implementation: MPICH 4.3.2
    Components:
      - MPICH 4.3.2 (from http://www.mpich.org/static/downloads release tgz for 4.3.2)
      - AWS-OFI-RCCL 1.4.0-1 (from https://github.com/ROCm/aws-ofi-rccl commit 6dae1b0)
      - RCCL (from https://github.com/ROCm/rccl-tests commit 5272cd1)
      - OSU micro-benchmarks 7.5.2 (from https://mvapich.cse.ohio-state.edu/download/mvapich release tgz for 7.5.2)
  template: mpich/Ubuntu_Rocm_Slingshot
  force: false
  env:
  - AWS_OFI_RCCL_COMMIT=6dae1b0
  - AWS_OFI_RCCL_REPO=https://github.com/ROCm/aws-ofi-rccl
  - AWS_OFI_RCCL_VERSION=1.4.0-1
      #
  - MPICH_SOURCE=http://www.mpich.org/static/downloads
  - MPICH_VERSION=4.3.2
      #
  - OSU_SOURCE=https://mvapich.cse.ohio-state.edu/download/mvapich
  - OSU_VERSION=7.5.2
      #
  - RCCL_TESTS_COMMIT=5272cd1
  - RCCL_TESTS_GPU_ARCHS=gfx90a
  - RCCL_TESTS_REPO=https://github.com/ROCm/rccl-tests
  - RCCL_TESTS_VERSION=0.1-5272cd1
  export:
    name: lumi-multitorch-mpich-u24r64f21m43t29
    def: |
      %runscript
      if [ "${SLURM_NNODES}" = 1 ] && [ -z "${SLURM_GPUS_ON_NODE}" ]; then
          export FI_HMEM_DISABLE_P2P=1
      fi
      exec "$@"

  cf_hash: f006cf1fb2e3235dfcc4da0368c4aa7b3bed7b2b
  cf_lineage: 47b20f78942bf7924132a14efa03deb9f981dded,399b53a392da96694e61eedfb68f5bda0a4d03da,f006cf1fb2e3235dfcc4da0368c4aa7b3bed7b2b
  cf_text: "ARG BASE_IMAGE=lumi-multitorch-libfabric-u24r64f21m43t29\nARG AWS_OFI_RCCL_COMMIT=6dae1b0\n\
    ARG AWS_OFI_RCCL_REPO=https://github.com/ROCm/aws-ofi-rccl\nARG AWS_OFI_RCCL_VERSION=1.4.0-1\n\
    ARG MPICH_SOURCE=http://www.mpich.org/static/downloads\nARG MPICH_VERSION=4.3.2\n\
    ARG OSU_SOURCE=https://mvapich.cse.ohio-state.edu/download/mvapich\nARG OSU_VERSION=7.5.2\n\
    ARG RCCL_TESTS_COMMIT=5272cd1\nARG RCCL_TESTS_GPU_ARCHS=gfx90a\nARG RCCL_TESTS_REPO=https://github.com/ROCm/rccl-tests\n\
    ARG RCCL_TESTS_VERSION=0.1-5272cd1\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG AS builder\n\
    \nARG AWS_OFI_RCCL_COMMIT\nARG AWS_OFI_RCCL_REPO\nARG AWS_OFI_RCCL_VERSION\n\n\
    ARG BASE_IMAGE\nARG BASE_IMAGE_TAG\n\nARG MPICH_SOURCE\nARG MPICH_VERSION\n\n\
    ARG OSU_SOURCE\nARG OSU_VERSION\n\nARG RCCL_TESTS_COMMIT\nARG RCCL_TESTS_GPU_ARCHS\n\
    ARG RCCL_TESTS_REPO\nARG RCCL_TESTS_VERSION\n\n\n#\n# Install FPM package builder\
    \ using GEM (only for the builder image)\n#\n\nRUN set -ue; \\\n  export DEBIAN_FRONTEND=noninteractive;\
    \ \\\n  apt-get update; \\\n  apt-get install -y ruby ruby-dev; \\\n  gem install\
    \ --no-document fpm; \\\n  mkdir /debs;\n\n\n#\n# Build and install MPICH package\
    \ into the builder container\n#\n\nRUN set -ue; \\\n  TMPROOT=$(mktemp -d); \\\
    \n  MPICH_TGZ=\"mpich-${MPICH_VERSION}.tar.gz\"; \\\n  MPICH_URL=\"${MPICH_SOURCE}/${MPICH_VERSION}/${MPICH_TGZ}\"\
    ; \\\n  install -d \"$TMPROOT/usr\" \"$TMPROOT/src\"; \\\n  curl -L -o \"${TMPROOT}/src/${MPICH_TGZ}\"\
    \ \"${MPICH_URL}\"; \\\n  tar -C \"${TMPROOT}/src\" -xf \"${TMPROOT}/src/${MPICH_TGZ}\"\
    \ --no-same-owner; \\\n  cd \"${TMPROOT}/src/mpich-${MPICH_VERSION}\"; \\\n  ./configure\
    \ --disable-fortran --enable-fast=O3 --enable-threads=multiple --prefix=/usr --with-device=ch4:ofi\
    \ --with-hip=/opt/rocm --with-libfabric --with-xpmem=/usr --without-cuda --without-ucx;\
    \ \\\n  make -j $(nproc) DESTDIR=\"$TMPROOT\" install; \\\n  cd /debs; \\\n  fpm\
    \ -s dir -t deb -n mpich -v \"${MPICH_VERSION}\" --description \"LUMI-AIF-$(date\
    \ -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"  usr/bin usr/etc usr/include\
    \ usr/lib usr/share; \\\n  rm -rf \"$TMPROOT\"; \\\n  dpkg -i \"mpich_${MPICH_VERSION}_amd64.deb\"\
    ;\n\n\n#\n# Build and install OSU Benchmarks package into the builder container\n\
    #\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d); \\\n    OSU_TGZ=\"osu-micro-benchmarks-${OSU_VERSION}.tar.gz\"\
    ; \\\n    OSU_URL=\"${OSU_SOURCE}/${OSU_TGZ}\"; \\\n    install -d \"$TMPROOT/libexec\"\
    \ \"$TMPROOT/src\"; \\\n    curl -L -o \"${TMPROOT}/src/${OSU_TGZ}\" \"${OSU_URL}\"\
    ; \\\n    tar -C \"${TMPROOT}/src\" -xf \"${TMPROOT}/src/${OSU_TGZ}\" --no-same-owner;\
    \ \\\n    cd \"${TMPROOT}/src/osu-micro-benchmarks-${OSU_VERSION}\"; \\\n    ./configure\
    \ --prefix=/usr CC=mpicc CXX=mpicxx --enable-rocm --with-rocm=/opt/rocm; \\\n\
    \    make -j $(nproc) DESTDIR=\"$TMPROOT\" install; \\\n    cd /debs; \\\n   \
    \ fpm -s dir -t deb -n osu-micro-benchmarks -v \"${OSU_VERSION}\" --description\
    \ \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"  usr/libexec;\
    \ \\\n    rm -rf \"$TMPROOT\"; \\\n    dpkg -i \"osu-micro-benchmarks_${OSU_VERSION}_amd64.deb\"\
    \n\n\n#\n# Build and install AWS-OFI-RCCL package into the builder container\n\
    #\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d); \\\n    git clone \"${AWS_OFI_RCCL_REPO}\"\
    \ \"$TMPROOT/aws-ofi-rccl\"; \\\n    cd  \"$TMPROOT/aws-ofi-rccl\"; \\\n    git\
    \ checkout \"${AWS_OFI_RCCL_COMMIT}\"; \\\n    ./autogen.sh; \\\n    ./configure\
    \ --with-libfabric=/usr --enable-trace --disable-tests --prefix=/usr; \\\n   \
    \ make -j $(nproc) DESTDIR=\"$TMPROOT\" install; \\\n    cd /debs; \\\n    fpm\
    \ -s dir -t deb -n aws-ofi-rccl -v \"${AWS_OFI_RCCL_VERSION}\" --description \"\
    LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"  usr/lib; \\\n\
    \    rm -rf \"$TMPROOT\"; \\\n    dpkg -i \"aws-ofi-rccl_${AWS_OFI_RCCL_VERSION}_amd64.deb\"\
    ;\n\n\n#\n# Build and install rccl-tests package into the builder container\n\
    #\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d); \\\n    git clone \"${RCCL_TESTS_REPO}\"\
    \ \"$TMPROOT/rccl-tests\"; \\\n    cd  \"$TMPROOT/rccl-tests\"; \\\n    git checkout\
    \ \"${RCCL_TESTS_COMMIT}\"; \\\n    make -j $(nproc) MPI=1 GPU_TARGETS=\"${RCCL_TESTS_GPU_ARCHS}\"\
    ; \\\n    install -d \"${TMPROOT}/libexec/rccl-tests\"; \\\n    cp build/*_perf\
    \ \"${TMPROOT}/libexec/rccl-tests\"; \\\n    cd /debs; \\\n    fpm -s dir -t deb\
    \ -n rccl-tests -v \"${RCCL_TESTS_VERSION}\" --description \"LUMI-AIF-$(date -u\
    \ +'%Y%m%d%H%M%S')\" --prefix /usr -C \"$TMPROOT\" libexec; \\\n    rm -rf \"\
    $TMPROOT\"; \\\n    dpkg -i \"rccl-tests_${RCCL_TESTS_VERSION}_amd64.deb\"\n\n\
    \n#\n# Copy the Debian packages created in the previous steps from the builder\
    \ image to\n# the final image and install them.\n#\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\
    \nCOPY --from=builder /debs/*.deb /tmp/debs/\n\nRUN set -ue; \\\n    #\n    #\
    \ Install all built Ubuntu packages\n    #\n    dpkg -i /tmp/debs/*.deb; \\\n\
    \    rm -rf /tmp/debs; \\\n    #\n    # Add SBOM\n    #\n    apt_json=\"$(dpkg-query\
    \ -W -f='${Package}\\t${Version}\\n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\
    \\t\") | {name: .[0], version: .[1]})')\"; \\\n    jq -n --argjson apt \"$apt_json\"\
    \  '{apt: $apt}' > /.sbom.json;\n\nENV MPIR_CVAR_CH4_OFI_ENABLE_HMEM=1\nENV MPIR_CVAR_CH4_OFI_ENABLE_MR_HMEM=1\n\
    ENV MPIR_CVAR_ENABLE_GPU=1\n\nCMD [\"/bin/bash\"]\n"
