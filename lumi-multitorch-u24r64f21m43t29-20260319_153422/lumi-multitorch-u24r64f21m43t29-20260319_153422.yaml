name: "lumi-multitorch-u24r64f21m43t29"
tag: "20260319_153422"
release: "lumi-multitorch-u24r64f21m43t29-20260319_153422"
desc: |
  This collection of container images is developed by the LUMI AI Factory and is
  specifically designed for use on the LUMI supercomputer. The images are built
  using recipes available in the LUMI AI Factory GitHub repository. Each image of
  the release builds on the previous one by adding new features, finally resulting
  in a fully featured, GPU-enabled and MPI-capable PyTorch-based multipurpose
  ML/AI container image.

  All build artifacts are publicly available. This includes the full recipe,
  Containerfiles, build logs, and the resulting final container images. This
  transparent approach enables full customization for special use cases, reuse
  on other similar systems, as well as adapting the images to run on cloud
  environments.

  All images are published to Docker Hub, and ready-to-run Apptainer/Singularity
  `.sif` versions of the images are available directly on LUMI. The generated
  Containerfiles and other artifacts are released as public GitHub releases.

  The release identifier `lumi-multitorch-u24r64f21m43t29-20260319_153422` encodes
  the following information:
    - lumi: The primary target system for the images (LUMI)
    - multitorch: Image type (a multipurpose PyTorch image)
    - u24r64f21m43t29: Major software versions digest, consisting of:
      - u24: Digest from Ubuntu 24.04 LTS
      - r64: Digest from ROCm 6.4.4
      - f21: Digest from libfabric 2.1
      - m43: Digest from MPICH 4.3.2
      - t29: Digest from PyTorch 2.9.1
    - 20260319_153422: Timestamp-based build tag

  This release includes five images, each building on the previous one by adding
  new major functionality in the following order:
    - `lumi-multitorch-rocm-u24r64f21m43t29`: Starts from Ubuntu base image and adds ROCm 6.4.4
    - `lumi-multitorch-libfabric-u24r64f21m43t29`: Adds libfabric 2.1 to the ROCm image
    - `lumi-multitorch-mpich-u24r64f21m43t29`: Adds MPICH 4.3.2 with GPU support to the libfabric image
    - `lumi-multitorch-torch-u24r64f21m43t29`: Adds PyTorch 2.9.1 to the MPICH image
    - `lumi-multitorch-full-u24r64f21m43t29`: Adds selection of AI and ML libraries to the PyTorch image

  The final image, `lumi-multitorch-full-u24r64f21m43t29-20260319_153422`,
  includes these key software components:
    - Ubuntu 24.04 LTS (from https://hub.docker.com/layers/library/ubuntu/noble-20260217)
    - AMD ROCm 6.4.4 (from https://repo.radeon.com/rocm)
    - Xpmem (from https://github.com/hpc/xpmem commit 3bcab55)
    - Cassini headers (from https://github.com/HewlettPackard/shs-cassini-headers release tgz for 12.0.1)
    - CXI headers (from https://github.com/HewlettPackard/shs-cxi-driver commit 27f7be5)
    - Libcxi (from https://github.com/HewlettPackard/shs-libcxi commit 30fa2dd)
    - Libfabric 2.1 (from https://github.com/ofiwg/libfabric commit 78d6e03)
    - MPICH 4.3.2 (from http://www.mpich.org/static/downloads release tgz for 4.3.2)
    - AWS-OFI-RCCL 1.4.0-1 (from https://github.com/ROCm/aws-ofi-rccl commit 6dae1b0)
    - RCCL (from https://github.com/ROCm/rccl-tests commit 5272cd1)
    - OSU micro-benchmarks 7.5.2 (from https://mvapich.cse.ohio-state.edu/download/mvapich release tgz for 7.5.2)
    - PyTorch 2.9.1 (from https://download.pytorch.org/whl/rocm6.4/torch-2.9.1%2Brocm6.4-cp312-cp312-manylinux_2_28_x86_64.whl)
    - TorchVision (from https://download.pytorch.org/whl/rocm6.4/torchvision-0.24.1%2Brocm6.4-cp312-cp312-manylinux_2_28_x86_64.whl)
    - TorchAudio (from https://download.pytorch.org/whl/rocm6.4/torchaudio-2.9.1%2Brocm6.4-cp312-cp312-manylinux_2_28_x86_64.whl)
    - PyTorch Triton (from https://download.pytorch.org/whl/pytorch_triton_rocm-3.5.1-cp312-cp312-linux_x86_64.whl)
    - Apex (from https://github.com/ROCm/apex commit e37ed12)
    - Causal Conv1D (from https://github.com/Dao-AILab/causal-conv1d commit 0d2252d)
    - DeepSpeed 0.18.8 (with locally built ops addons)
    - Flash Attention (from https://github.com/ROCm/flash-attention commit bbe25ba)
    - LLM Compressor: (from https://github.com/vllm-project/llm-compressor commit 6a6cfec)
    - Megatron LM (experimental): (from https://github.com/viahlgre/Megatron-LM commit c333868)
    - vLLM v0.16.0 (from https://github.com/vllm-project/vllm commit 89a77b1)
    - xFormers (from https://github.com/facebookresearch/xformers commit 41531ce)

  These additional packages from PyPI are also included in the final image:
    - accelerate
    - bitsandbytes
    - datasets
    - evaluate
    - huggingface-hub
    - jupyter
    - lightning
    - matplotlib
    - mpi4py
    - numba
    - numpy
    - pandas
    - peft
    - scipy
    - sentencepiece
    - tensorboard
    - trl
    - ultralytics

  Documentation for each image is provided separately in the `<image name>.md`
  Markdown text files, as well as in the next sections of this file. A Software
  Bill of Materials (SBOM) with full software version numbers is available for
  each image in files named `<image name>.json`. These files list all Ubuntu and
  Python packages used in the images. Containerfiles and build logs for each image
  are available in files named <image name>.Containerfile` and `<image name>.log`.

  All software in the images is installed as either Python or Ubuntu packages.
  Some packages are installed directly from Ubuntu repositories, some from PyPI,
  and others such as PyTorch and ROCm, are installed from external upstream
  package repositories (PyTorch project's repository, AMD's ROCm repository).
  Lastly, the remaining packages are built locally during the container build
  process and then installed as either Ubuntu or Python packages, resulting in
  all included software being managed by either Ubuntu or Python package managers.

  The GitHub release for this build consists of:
    - A `.yaml` recipe file which defines the build steps, software versions, and
      includes all required Containerfiles and documentation snippets to reproduce
      the build of this release.
    - Containerfiles and Singularity definition files (`.Containerfile`, `.def`)
      for convenience (this data is embedded in the `.yaml` recipe as well).
    - This release README file and separate per-image documentation (`.md`).
    - Build logs (`.log`) and SBOM files (`.json`) for all images for
      transparency.

  The images are available for direct use on LUMI:
    - Path to this exact release on LUMI is:
      `/appl/local/laifs/containers/lumi-multitorch-u24r64f21m43t29-20260319_153422`
    - Latest build with the same software digest as this release is symlinked at:
      `/appl/local/laifs/containers/lumi-multitorch-u24r64f21m43t29`
    - Latest version (over all digests) is symlinked at:
      `/appl/local/laifs/containers/lumi-multitorch`
    - Example listing of release directory content on LUMI:
      - `lumi-multitorch-u24r64f21m43t29-20260319_153422.md`: The main readme file
      - `lumi-multitorch-u24r64f21m43t29-20260319_153422.yaml`: The recipe file
      - `lumi-multitorch-full-u24r64f21m43t29-20260319_153422.sif`: Singularity image for the full image
      - `lumi-multitorch-full-u24r64f21m43t29-20260319_153422.md`: Readme file for the full image
      - `lumi-multitorch-full-u24r64f21m43t29-20260319_153422.json`: Software Bill of materials for the full image
      - `lumi-multitorch-torch-u24r64f21m43t29-20260319_153422.sif`: Singularity image for the torch image
      - `lumi-multitorch-torch-u24r64f21m43t29-20260319_153422.md`: Readme file for the torch image
      - `lumi-multitorch-torch-u24r64f21m43t29-20260319_153422.json`: Software Bill of materials for the torch image
      - `lumi-multitorch-mpich-u24r64f21m43t29-20260319_153422.sif`: Singularity image for the mpich image
      - `lumi-multitorch-mpich-u24r64f21m43t29-20260319_153422.md`: Readme file for the mpich image
      - `lumi-multitorch-mpich-u24r64f21m43t29-20260319_153422.json`: Software Bill of materials for the mpich image
      - `lumi-multitorch-libfabric-u24r64f21m43t29-20260319_153422.sif`: Singularity image for the libfabric image
      - `lumi-multitorch-libfabric-u24r64f21m43t29-20260319_153422.md`: Readme file for the libfabric image
      - `lumi-multitorch-libfabric-u24r64f21m43t29-20260319_153422.json`: Software Bill of materials for the libfabric image
      - `lumi-multitorch-rocm-u24r64f21m43t29-20260319_153422.sif`: Singularity image for the rocm image
      - `lumi-multitorch-rocm-u24r64f21m43t29-20260319_153422.md`: Readme file for the rocm image
      - `lumi-multitorch-rocm-u24r64f21m43t29-20260319_153422.json`: Software Bill of materials for the rocm image
      
  Illustrative example use on LUMI:
    ```
    uan:~> srun --gpus-per-task=2 <other srun args> singularity \
      run <singularity args> <path to sif image> \
        python -c 'import torch; print("num gpus:", torch.cuda.device_count())'
    [...]
    num gpus: 2
    ```

  On Docker Hub the images are available with the following tag/naming scheme:
    - The exact images from this recipe build:
      - Image full: `lumiaifactory/lumi-multitorch:full-u24r64f21m43t29-20260319_153422`
      - Image torch: `lumiaifactory/lumi-multitorch:torch-u24r64f21m43t29-20260319_153422`
      - Image mpich: `lumiaifactory/lumi-multitorch:mpich-u24r64f21m43t29-20260319_153422`
      - Image libfabric: `lumiaifactory/lumi-multitorch:libfabric-u24r64f21m43t29-20260319_153422`
      - Image rocm: `lumiaifactory/lumi-multitorch:rocm-u24r64f21m43t29-20260319_153422`
    - Latest build with specific significant software versions (using software digest):
      - Image full:  `lumiaifactory/lumi-multitorch:full-u24r64f21m43t29`
      - Image torch:  `lumiaifactory/lumi-multitorch:torch-u24r64f21m43t29`
      - Image mpich:  `lumiaifactory/lumi-multitorch:mpich-u24r64f21m43t29`
      - Image libfabric:  `lumiaifactory/lumi-multitorch:libfabric-u24r64f21m43t29`
      - Image rocm:  `lumiaifactory/lumi-multitorch:rocm-u24r64f21m43t29`
    - Floating tags for latest version (over any significant software versions / digests):
      - `lumiaifactory/lumi-multitorch:full`: latest complete full image across all variants
      - `lumiaifactory/lumi-multitorch:torch`: latest complete torch image across all variants
      - `lumiaifactory/lumi-multitorch:mpich`: latest complete mpich image across all variants
      - `lumiaifactory/lumi-multitorch:libfabric`: latest complete libfabric image across all variants
      - `lumiaifactory/lumi-multitorch:rocm`: latest complete rocm image across all variants
    - Example Docker Hub pull commands:
      - `docker pull lumiaifactory/lumi-multitorch:full-u24r64f21m43t29-20260319_153422`
      - `docker pull lumiaifactory/lumi-multitorch:torch-u24r64f21m43t29`
      - `docker pull lumiaifactory/lumi-multitorch:rocm`

steps:
- name: lumi-multitorch-rocm-u24r64f21m43t29
  base: ubuntu:noble-20260217
  desc: |
    **Overview**
    This is a base image building on Ubuntu 24.04 LTS upstream image
    with ROCm software from AMD's official Ubuntu repositories installed on top of
    it. The image also adds a few commonly used extra Ubuntu packages and enables
    man pages.

    **Details**
    Ubuntu base image: ubuntu:noble-20260217
    AMD ROCm repository: https://repo.radeon.com/rocm
    AMD ROCm release: 6.4.4
    Additional Ubuntu packages:
      - file
      - git
      - jq
      - less
      - lsof
      - nano
      - neovim
      - python3-dev
      - python3-packaging
      - python3-pip
      - python3-venv
      - screen
      - tmux
      - unzip
      - wget
  template: rocm/Ubuntu2404_Rocm6
  force: false
  env:
  - AMDGPU_REPO=https://repo.radeon.com/amdgpu
  - AMDGPU_VERSION=6.4.4
  - ROCM_REPO=https://repo.radeon.com/rocm
  - ROCM_VERSION=6.4.4
  - EXTRA_LOCALES="cs_CZ.UTF-8 da_DK.UTF-8 en_US.UTF-8 et_EE.UTF-8 fi_FI.UTF-8 nb_NO.UTF-8
    nn_NO.UTF-8 pl_PL.UTF-8"
  - EXTRA_PACKAGES="file git jq less lsof nano neovim python3-dev python3-packaging
    python3-pip python3-venv screen tmux unzip wget"
  export:
    name: lumi-multitorch-rocm-u24r64f21m43t29

  cf_hash: 47b20f78942bf7924132a14efa03deb9f981dded
  cf_lineage: 47b20f78942bf7924132a14efa03deb9f981dded
  cf_text: "ARG BASE_IMAGE=ubuntu\nARG BASE_IMAGE_TAG=noble-20260217\nARG AMDGPU_REPO=https://repo.radeon.com/amdgpu\n\
    ARG AMDGPU_VERSION=6.4.4\nARG ROCM_REPO=https://repo.radeon.com/rocm\nARG ROCM_VERSION=6.4.4\n\
    ARG EXTRA_LOCALES=\"cs_CZ.UTF-8 da_DK.UTF-8 en_US.UTF-8 et_EE.UTF-8 fi_FI.UTF-8\
    \ nb_NO.UTF-8 nn_NO.UTF-8 pl_PL.UTF-8\"\nARG EXTRA_PACKAGES=\"file git jq less\
    \ lsof nano neovim python3-dev python3-packaging python3-pip python3-venv screen\
    \ tmux unzip wget\"\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\nARG BASE_IMAGE\nARG\
    \ BASE_IMAGE_TAG\n\nARG AMDGPU_REPO\nARG AMDGPU_VERSION\n\nARG ROCM_REPO\nARG\
    \ ROCM_VERSION\n\nARG EXTRA_LOCALES\nARG EXTRA_PACKAGES\n\nRUN set -ue; \\\n \
    \ #\n  # Enable man pages with unminimize and install additional locales\n  #\n\
    \  export DEBIAN_FRONTEND=noninteractive; \\\n  apt-get update; \\\n  yes | unminimize;\
    \ \\\n  apt-get -y --no-install-recommends install man locales; \\\n  locale-gen\
    \ ${EXTRA_LOCALES}; \\\n  #\n  # Add ROCm repository\n  #\n  apt-get install -y\
    \ --no-install-recommends ca-certificates curl gnupg; \\\n  #\n  printf \"Package:\
    \ *\\nPin: release o=repo.radeon.com\\nPin-Priority: 800\\n\" > /etc/apt/preferences.d/rocm-pin-prio-800;\
    \ \\\n  #\n  curl -sL ${ROCM_REPO}/rocm.gpg.key | apt-key add -; \\\n  #\n  printf\
    \ \"deb [arch=amd64] ${ROCM_REPO}/apt/${ROCM_VERSION}/ noble main\\n\" | tee --append\
    \ /etc/apt/sources.list.d/rocm.list; \\\n  printf \"deb [arch=amd64] ${AMDGPU_REPO}/${AMDGPU_VERSION}/ubuntu\
    \ noble main\\n\" | tee /etc/apt/sources.list.d/amdgpu.list; \\\n  #\n  # Install\
    \ ROCm packages\n  #\n  apt-get update; \\\n  apt-get install -y --no-install-recommends\
    \ build-essential kmod libelf1 libnuma-dev zstd; \\\n  apt-get install -y --no-install-recommends\
    \ amdgpu-dkms rocm-dev$ROCM_VERSION rocm-libs$ROCM_VERSION; \\\n  #\n  echo /opt/rocm/lib\
    \ > /etc/ld.so.conf.d/rocm-30.conf; \\\n  ldconfig; \\\n  #\n  # Install extra\
    \ packages\n  #\n  apt-get -y --no-install-recommends install ${EXTRA_PACKAGES};\
    \ \\\n  apt clean ;\\\n  rm -rf /var/lib/apt/lists/*; \\\n  #\n  # Add SBOM\n\
    \  #\n  apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\n' | jq -R -s\
    \ 'split(\"\\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version: .[1]})')\"\
    ; \\\n  jq -n --argjson apt \"$apt_json\"  '{apt: $apt}' > /.sbom.json;\n"
- name: lumi-multitorch-libfabric-u24r64f21m43t29
  base: lumi-multitorch-rocm-u24r64f21m43t29
  desc: |
    **Overview**
    This image builds on top of its base image by adding locally built Ubuntu
    packages to enable xpmem as well as libfabric functionality for HPE's Slingshot
    interconnect. It serves as a starting point for adding MPI capability to images
    built on top of it and can be a useful foundation for creating images with
    custom MPI stacks.

    **Details**
    Base image: lumi-multitorch-rocm-u24r64f21m43t29
    Components:
      - xpmem (from https://github.com/hpc/xpmem commit 3bcab55)
      - Cassini headers (from https://github.com/HewlettPackard/shs-cassini-headers release tgz for 12.0.1)
      - CXI headers (from https://github.com/HewlettPackard/shs-cxi-driver commit 27f7be5)
      - libcxi (from https://github.com/HewlettPackard/shs-libcxi commit 30fa2dd)
      - Libfabric 2.1 (from https://github.com/ofiwg/libfabric commit 78d6e03)
  template: libfabric/Ubuntu_Rocm_Slingshot
  force: false
  env:
  - XPMEM_CLONE_URL=https://github.com/hpc/xpmem
  - XPMEM_GIT_COMMIT=3bcab55
  - XPMEM_VERSION=0.1-3bcab55
  - XPMEM_KERNEL_BASE_SRC=linux-headers-6.8.0-92_6.8.0-92.94_all.deb
  - XPMEM_KERNEL_GENERIC_SRC=linux-headers-6.8.0-92-generic_6.8.0-92.94_amd64.deb
  - XPMEM_KERNEL_ID=linux-headers-6.8.0-92-generic
      #
  - CASSINI_HEADERS_SOURCE=https://github.com/HewlettPackard/shs-cassini-headers
  - CASSINI_HEADERS_VERSION=12.0.1
      #
  - CXI_HEADERS_VERSION=1.0.0-SHS12.0.2-27f7be5
  - CXI_HEADERS_CLONE_URL=https://github.com/HewlettPackard/shs-cxi-driver
  - CXI_HEADERS_GIT_COMMIT=27f7be5
      #
  - LIBCXI_VERSION=1.0.2-SHS12.0.2-30fa2dd
  - LIBCXI_CLONE_URL=https://github.com/HewlettPackard/shs-libcxi
  - LIBCXI_GIT_COMMIT=30fa2dd
      #
  - LIBFABRIC_VERSION=2.1-78d6e03
  - LIBFABRIC_CLONE_URL=https://github.com/ofiwg/libfabric
  - LIBFABRIC_GIT_COMMIT=78d6e03
  export:
    name: lumi-multitorch-libfabric-u24r64f21m43t29
    def: |
      %runscript
      if [ "${SLURM_NNODES}" = 1 ] && [ -z "${SLURM_GPUS_ON_NODE}" ]; then
          export FI_HMEM_DISABLE_P2P=1
      fi
      exec "$@"

  cf_hash: 399b53a392da96694e61eedfb68f5bda0a4d03da
  cf_lineage: 47b20f78942bf7924132a14efa03deb9f981dded,399b53a392da96694e61eedfb68f5bda0a4d03da
  cf_text: "ARG BASE_IMAGE=lumi-multitorch-rocm-u24r64f21m43t29\nARG XPMEM_CLONE_URL=https://github.com/hpc/xpmem\n\
    ARG XPMEM_GIT_COMMIT=3bcab55\nARG XPMEM_VERSION=0.1-3bcab55\nARG XPMEM_KERNEL_BASE_SRC=linux-headers-6.8.0-92_6.8.0-92.94_all.deb\n\
    ARG XPMEM_KERNEL_GENERIC_SRC=linux-headers-6.8.0-92-generic_6.8.0-92.94_amd64.deb\n\
    ARG XPMEM_KERNEL_ID=linux-headers-6.8.0-92-generic\nARG CASSINI_HEADERS_SOURCE=https://github.com/HewlettPackard/shs-cassini-headers\n\
    ARG CASSINI_HEADERS_VERSION=12.0.1\nARG CXI_HEADERS_VERSION=1.0.0-SHS12.0.2-27f7be5\n\
    ARG CXI_HEADERS_CLONE_URL=https://github.com/HewlettPackard/shs-cxi-driver\nARG\
    \ CXI_HEADERS_GIT_COMMIT=27f7be5\nARG LIBCXI_VERSION=1.0.2-SHS12.0.2-30fa2dd\n\
    ARG LIBCXI_CLONE_URL=https://github.com/HewlettPackard/shs-libcxi\nARG LIBCXI_GIT_COMMIT=30fa2dd\n\
    ARG LIBFABRIC_VERSION=2.1-78d6e03\nARG LIBFABRIC_CLONE_URL=https://github.com/ofiwg/libfabric\n\
    ARG LIBFABRIC_GIT_COMMIT=78d6e03\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG AS builder\n\
    \nARG CASSINI_HEADERS_SOURCE\nARG CASSINI_HEADERS_VERSION\n\nARG CXI_HEADERS_CLONE_URL\n\
    ARG CXI_HEADERS_GIT_COMMIT\nARG CXI_HEADERS_VERSION\n\nARG LIBCXI_CLONE_URL\n\
    ARG LIBCXI_GIT_COMMIT\nARG LIBCXI_VERSION\n\nARG LIBFABRIC_CLONE_URL\nARG LIBFABRIC_GIT_COMMIT\n\
    ARG LIBFABRIC_VERSION\n\nARG XPMEM_CLONE_URL\nARG XPMEM_GIT_COMMIT\nARG XPMEM_KERNEL_BASE_SRC\n\
    ARG XPMEM_KERNEL_GENERIC_SRC\nARG XPMEM_KERNEL_ID\nARG XPMEM_VERSION\n\nRUN set\
    \ -ue; \\\n    #\n    # Build requisites\n    #\n    export DEBIAN_FRONTEND=noninteractive;\
    \ \\\n    apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y\
    \ \\\n        autoconf \\\n        libconfig-dev \\\n        libcurl4-openssl-dev\
    \ \\\n        libfuse-dev \\\n        libjson-c-dev \\\n        libnl-3-dev \\\
    \n        libsensors-dev \\\n        libtool \\\n        libuv1-dev \\\n     \
    \   libyaml-dev \\\n        pkg-config \\\n        ruby \\\n        ruby-dev;\
    \ \\\n    gem install --no-document fpm; \\\n    mkdir /debs;\n\nRUN set -ue;\
    \ \\\n    #\n    # XPMEM\n    #\n    TMPROOT=$(mktemp -d); \\\n    #\n    XPMEM_KERNEL_PATH=${TMPROOT}/src/kernel/usr/src/${XPMEM_KERNEL_ID};\
    \ \\\n    #\n    install -d \"$TMPROOT/src\" \"$TMPROOT/src/kernel\"  \"$TMPROOT/usr\"\
    ; \\\n    cd \"$TMPROOT/src\"; \\\n    wget http://archive.ubuntu.com/ubuntu/pool/main/l/linux/${XPMEM_KERNEL_BASE_SRC};\
    \ \\\n    wget http://archive.ubuntu.com/ubuntu/pool/main/l/linux/${XPMEM_KERNEL_GENERIC_SRC};\
    \ \\\n    dpkg-deb -x ${XPMEM_KERNEL_BASE_SRC} kernel/; \\\n    dpkg-deb -x ${XPMEM_KERNEL_GENERIC_SRC}\
    \ kernel/; \\\n    #\n    git clone ${XPMEM_CLONE_URL} \"$TMPROOT/src/xpmem\"\
    ; \\\n    cd \"$TMPROOT/src/xpmem\"; \\\n    git checkout \"${XPMEM_GIT_COMMIT}\"\
    ; \\\n    ./autogen.sh; \\\n    ./configure --prefix=/usr --with-kerneldir=${XPMEM_KERNEL_PATH};\
    \ \\\n    make -j \"$(nproc)\" DESTDIR=\"$TMPROOT\" install; \\\n    #\n    cd\
    \ /debs; \\\n    fpm -s dir -t deb -n xpmem -v \"${XPMEM_VERSION}\" --description\
    \ \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\" usr/include\
    \ usr/lib; \\\n    dpkg -i \"xpmem_${XPMEM_VERSION}_amd64.deb\";\n\nRUN set -ue;\
