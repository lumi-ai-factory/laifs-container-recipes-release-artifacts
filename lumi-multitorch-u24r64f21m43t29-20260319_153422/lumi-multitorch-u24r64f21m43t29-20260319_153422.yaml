- name: "lumi-multitorch-u24r64f21m43t29-20260319_153422-post.sh"
  desc: "Script for performing post-build actions"
  content: |-
    #!/bin/bash

    # This script is used for executing post-build tasks and should run after
    # the image builds complete. Working directory needs to be the build dir.
    #
    # The script performs these actions:
    # - Extracts and saves SBOM files from the images.
    # - Generates a dedicated README file for each image.
    # - Executes image tests if the test script is available.
    # - Creates a SHA256 checksum file for all generated artifacts.

    recipe_file="lumi-multitorch-u24r64f21m43t29-20260319_153422.yaml"

    # Save per image files for lumi-multitorch-full-u24r64f21m43t29-20260319_153422
    step_name="lumi-multitorch-full-u24r64f21m43t29"
    image_name="lumi-multitorch-full-u24r64f21m43t29-20260319_153422"

    podman run -it --rm "${step_name}:20260319_153422" cat /.sbom.json > "${image_name}.json"

    readme_file="${image_name}.md"
    image_desc="$(yq . $recipe_file | jq -c -r ".steps[]|select(.name == \"$step_name\")|.desc")"
    image_meta="$(podman image inspect "${step_name}:20260319_153422" | jq -r 'first|{Id,Created}|to_entries[]|"\(.key): \(.value)"')"

    printf '# Container Image %s\n\n' "$image_name" > "$readme_file"
    printf '%s\n\n' "$image_meta" >> "$readme_file"
    printf '## Description\n\n%s\n\n' "$image_desc"  >> "$readme_file"
    printf '## Files\n\n' >> "$readme_file"
    sha256sum lumi-multitorch-full-u24r64f21m43t29-20260319_153422.{Containerfile,def,json,log,sif} >> "$readme_file"


    # Save per image files for lumi-multitorch-torch-u24r64f21m43t29-20260319_153422
