    \nARG LLMCOMPRESSOR_REPO\nARG LLMCOMPRESSOR_COMMIT\n\nARG VLLM_COMMIT\nARG VLLM_REPO\n\
    \nARG XFORMERS_COMMIT\nARG XFORMERS_REPO\n\n#\n# Prepare build environment\n#\n\
