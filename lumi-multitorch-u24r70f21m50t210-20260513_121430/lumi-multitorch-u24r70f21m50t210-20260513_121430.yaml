    \  - PyTorch Triton: https://download.pytorch.org/whl/triton_rocm-3.6.0-cp312-cp312-linux_x86_64.whl\n\
    \n\n### Image lumi-multitorch-full-u24r70f21m50t210-20260513_121430\n\n**Overview**\n\
    This is a multipurpose ML/AI image that builds on its base image by adding a\n\
