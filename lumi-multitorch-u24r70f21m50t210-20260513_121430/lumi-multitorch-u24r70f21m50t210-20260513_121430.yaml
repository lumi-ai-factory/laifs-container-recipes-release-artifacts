    \ Starts from Ubuntu base image and adds ROCm 7.0.2\n  - `lumi-multitorch-libfabric-u24r70f21m50t210`:\
    \ Adds libfabric 2.1 to the ROCm image\n  - `lumi-multitorch-mpich-u24r70f21m50t210`:\
    \ Adds MPICH 5.0.1 with GPU support to the libfabric image\n  - `lumi-multitorch-torch-u24r70f21m50t210`:\
    \ Adds PyTorch 2.10.0 to the MPICH image\n  - `lumi-multitorch-full-u24r70f21m50t210`:\
    \ Adds selection of AI and ML libraries to the PyTorch image\n  - `lumi-multitorch-plus-u24r70f21m50t210`:\
    \ Adds experimental software to the Full image\n\nThe final image, `lumi-multitorch-full-u24r70f21m50t210-20260513_121430`,\n\
    includes these key software components:\n  - Ubuntu 24.04 LTS (from https://hub.docker.com/layers/library/ubuntu/noble-20260324)\n\
