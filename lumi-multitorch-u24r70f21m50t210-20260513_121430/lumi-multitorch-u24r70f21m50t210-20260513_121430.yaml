- name: lumi-multitorch-u24r70f21m50t210-20260513_121430.md
  content: "# LUMI AI Factory Container Image Collection lumi-multitorch-u24r70f21m50t210\
    \ release 20260513_121430\n\n**Release Links:**\n- [GitHub Release](https://github.com/lumi-ai-factory/laifs-container-recipes/releases/tag/lumi-multitorch-u24r70f21m50t210-20260513_121430)\n\
    - [Known Issues](https://github.com/lumi-ai-factory/laifs-container-recipes/issues?q=label%3Alumi-multitorch-u24r70f21m50t210-20260513_121430)\n\
    \n**Related Links:**\n- [LUMI AI Factory](https://lumi-ai-factory.eu/)\n- [LUMI\
    \ Supercomputer](https://lumi-supercomputer.eu/)\n- [GitHub Repository](https://github.com/lumi-ai-factory/laifs-container-recipes)\n\
    - [GitHub Releases](https://github.com/lumi-ai-factory/laifs-container-recipes/releases)\n\
    - [Docker Hub](https://hub.docker.com/u/lumiaifactory)\n\n## Overview\n\nThis\
    \ collection of container images is developed by the LUMI AI Factory and is\n\
    specifically designed for use on the LUMI supercomputer. The images are built\n\
    using recipes available in the LUMI AI Factory GitHub repository. Each image of\n\
    the release builds on the previous one by adding new features, finally resulting\n\
    in a fully featured, GPU-enabled and MPI-capable PyTorch-based multipurpose\n\
    ML/AI container image.\n\nAll build artifacts are publicly available. This includes\
    \ the full recipe,\nContainerfiles, build logs, and the resulting final container\
    \ images. This\ntransparent approach enables full customization for special use\
    \ cases, reuse\non other similar systems, as well as adapting the images to run\
    \ on cloud\nenvironments.\n\nAll images are published to Docker Hub, and ready-to-run\
    \ Singularity Image Format\n(SIF) versions of the images are available directly\
    \ on LUMI. The generated\nContainerfiles and other artifacts are released as public\
    \ GitHub releases.\n\nThe release identifier `lumi-multitorch-u24r70f21m50t210-20260513_121430`\
    \ encodes\nthe following information:\n  - lumi: The primary target system for\
    \ the images (LUMI)\n  - multitorch: Image type (a multipurpose PyTorch image)\n\
    \  - u24r70f21m50t210: Major software versions digest, consisting of:\n    - u24:\
    \ Digest from Ubuntu 24.04 LTS\n    - r70: Digest from ROCm 7.0.2\n    - f21:\
    \ Digest from libfabric 2.1\n    - m50: Digest from MPICH 5.0.1\n    - t210: Digest\
    \ from PyTorch 2.10.0\n  - 20260513_121430: Timestamp-based build tag\n\nThis\
    \ release includes six images, each building on the previous one by adding\nnew\
