name: "lumi-multitorch-u24r70f21m50t210"
tag: "20260513_121430"
release: "lumi-multitorch-u24r70f21m50t210-20260513_121430"
desc: |
  This collection of container images is developed by the LUMI AI Factory and is
  specifically designed for use on the LUMI supercomputer. The images are built
  using recipes available in the LUMI AI Factory GitHub repository. Each image of
  the release builds on the previous one by adding new features, finally resulting
  in a fully featured, GPU-enabled and MPI-capable PyTorch-based multipurpose
  ML/AI container image.

  All build artifacts are publicly available. This includes the full recipe,
  Containerfiles, build logs, and the resulting final container images. This
  transparent approach enables full customization for special use cases, reuse
  on other similar systems, as well as adapting the images to run on cloud
  environments.

  All images are published to Docker Hub, and ready-to-run Singularity Image Format
  (SIF) versions of the images are available directly on LUMI. The generated
  Containerfiles and other artifacts are released as public GitHub releases.

  The release identifier `lumi-multitorch-u24r70f21m50t210-20260513_121430` encodes
  the following information:
    - lumi: The primary target system for the images (LUMI)
    - multitorch: Image type (a multipurpose PyTorch image)
    - u24r70f21m50t210: Major software versions digest, consisting of:
      - u24: Digest from Ubuntu 24.04 LTS
      - r70: Digest from ROCm 7.0.2
      - f21: Digest from libfabric 2.1
      - m50: Digest from MPICH 5.0.1
      - t210: Digest from PyTorch 2.10.0
    - 20260513_121430: Timestamp-based build tag

  This release includes six images, each building on the previous one by adding
  new major functionality in the following order:
    - `lumi-multitorch-rocm-u24r70f21m50t210`: Starts from Ubuntu base image and adds ROCm 7.0.2
    - `lumi-multitorch-libfabric-u24r70f21m50t210`: Adds libfabric 2.1 to the ROCm image
    - `lumi-multitorch-mpich-u24r70f21m50t210`: Adds MPICH 5.0.1 with GPU support to the libfabric image
    - `lumi-multitorch-torch-u24r70f21m50t210`: Adds PyTorch 2.10.0 to the MPICH image
    - `lumi-multitorch-full-u24r70f21m50t210`: Adds selection of AI and ML libraries to the PyTorch image
    - `lumi-multitorch-plus-u24r70f21m50t210`: Adds experimental software to the Full image

  The final image, `lumi-multitorch-full-u24r70f21m50t210-20260513_121430`,
  includes these key software components:
    - Ubuntu 24.04 LTS (from https://hub.docker.com/layers/library/ubuntu/noble-20260324)
    - AMD ROCm 7.0.2 (from https://repo.radeon.com/rocm)
    - Xpmem (from https://github.com/hpc/xpmem commit 3bcab55)
    - Cassini headers (from https://github.com/HewlettPackard/shs-cassini-headers release tgz for 12.0.1)
    - CXI headers (from https://github.com/HewlettPackard/shs-cxi-driver commit 27f7be5)
    - Libcxi (from https://github.com/HewlettPackard/shs-libcxi commit 30fa2dd)
    - Libfabric 2.1 (from https://github.com/ofiwg/libfabric commit 78d6e03)
    - MPICH 5.0.1 (from http://www.mpich.org/static/downloads release tgz for 5.0.1)
    - AWS-OFI-NCCL 1.19.1-git-206c02c (from https://github.com/aws/aws-ofi-nccl commit 206c02c)
    - RCCL (from https://github.com/ROCm/rccl-tests commit 5272cd1)
    - OSU micro-benchmarks 7.5.2 (from https://mvapich.cse.ohio-state.edu/download/mvapich release tgz for 7.5.2)
    - PyTorch 2.10.0 (from  tag v2.10.0)
    - TorchVision (from https://download-r2.pytorch.org/whl/rocm7.0/torchvision-0.25.0%2Brocm7.0-cp312-cp312-manylinux_2_28_x86_64.whl)
    - TorchAudio (from https://download-r2.pytorch.org/whl/rocm7.0/torchaudio-2.10.0%2Brocm7.0-cp312-cp312-manylinux_2_28_x86_64.whl)
    - PyTorch Triton (from https://download.pytorch.org/whl/triton_rocm-3.6.0-cp312-cp312-linux_x86_64.whl)
    - Apex (from https://github.com/ROCm/apex commit 73423b4)
    - Causal Conv1D (from https://github.com/Dao-AILab/causal-conv1d commit 0d2252d)
    - DeepSpeed 0.18.9 (with locally built ops addons)
    - Flash Attention (from https://github.com/ROCm/flash-attention commit bbe25ba)
    - LLM Compressor: (from https://github.com/vllm-project/llm-compressor commit 5a1552e)
    - Megatron LM (experimental): (from https://github.com/viahlgre/Megatron-LM commit c333868)
    - vLLM v0.20.1 (from https://github.com/vllm-project/vllm commit 132765e)
    - xFormers (from https://github.com/facebookresearch/xformers commit 03b91d7)

  These additional packages from PyPI are also included in the final image:
    - accelerate
    - bitsandbytes
    - datasets
    - evaluate
    - h5py
    - huggingface-hub
    - jupyter
    - lightning
    - matplotlib
    - mlflow
    - mpi4py
    - numba
    - numpy
    - pandas
    - peft
    - scipy
    - sentence-transformers
    - sentencepiece
    - tensorboard
    - trl
    - ultralytics-opencv-headless

  The experimental image lumi-multitorch-plus-u24r70f21m50t210-20260513_121430
  builds on the full image by introducing experimental software additions and
  potentially breaking changes. It is not intended for production use, but rather
  as a testing ground for evaluating potential future additions and for hosting
  software with breaking dependencies or other limitations. See the image
  description below.

  Documentation for each image is provided separately in the `<image name>.md`
  Markdown text files, as well as in the next sections of this file. A Software
  Bill of Materials (SBOM) with full software version numbers is available for
  each image in files named `<image name>.json`. These files list all Ubuntu and
  Python packages used in the images. Containerfiles and build logs for each image
  are available in files named <image name>.Containerfile` and `<image name>.log`.

  All software in the images is installed as either Python or Ubuntu packages.
  Some packages are installed directly from Ubuntu repositories, some from PyPI,
  and others such as PyTorch and ROCm, are installed from external upstream
  package repositories (PyTorch project's repository, AMD's ROCm repository).
  Lastly, the remaining packages are built locally during the container build
  process and then installed as either Ubuntu or Python packages, resulting in
  all included software being managed by either Ubuntu or Python package managers.

  The GitHub release for this build consists of:
    - A `.yaml` recipe file which defines the build steps, software versions, and
      includes all required Containerfiles and documentation snippets to reproduce
      the build of this release.
    - Containerfiles (`.Containerfile`)
      for convenience (this data is embedded in the `.yaml` recipe as well).
    - This release README file and separate per-image documentation (`.md`).
    - Build logs (`.log`) and SBOM files (`.json`) for all images for
      transparency.

  The images are available for direct use on LUMI:
    - Path to this exact release on LUMI is:
      `/appl/local/laifs/containers/lumi-multitorch-u24r70f21m50t210-20260513_121430`
    - Latest build with the same software digest as this release is symlinked at:
      `/appl/local/laifs/containers/lumi-multitorch-u24r70f21m50t210`
    - Latest version (over all digests) is symlinked at:
      `/appl/local/laifs/containers/lumi-multitorch`
    - Example listing of release directory content on LUMI:
      - `lumi-multitorch-u24r70f21m50t210-20260513_121430.md`: The main readme file
      - `lumi-multitorch-u24r70f21m50t210-20260513_121430.yaml`: The recipe file
      - `lumi-multitorch-plus-u24r70f21m50t210-20260513_121430.sif`: SIF image for the plus image
      - `lumi-multitorch-plus-u24r70f21m50t210-20260513_121430.md`: Readme file for the plus image
      - `lumi-multitorch-plus-u24r70f21m50t210-20260513_121430.json`: Software Bill of materials for the plus image
      - `lumi-multitorch-full-u24r70f21m50t210-20260513_121430.sif`: SIF image for the full image
      - `lumi-multitorch-full-u24r70f21m50t210-20260513_121430.md`: Readme file for the full image
      - `lumi-multitorch-full-u24r70f21m50t210-20260513_121430.json`: Software Bill of materials for the full image
      - `lumi-multitorch-torch-u24r70f21m50t210-20260513_121430.sif`: SIF image for the torch image
      - `lumi-multitorch-torch-u24r70f21m50t210-20260513_121430.md`: Readme file for the torch image
      - `lumi-multitorch-torch-u24r70f21m50t210-20260513_121430.json`: Software Bill of materials for the torch image
      - `lumi-multitorch-mpich-u24r70f21m50t210-20260513_121430.sif`: SIF image for the mpich image
      - `lumi-multitorch-mpich-u24r70f21m50t210-20260513_121430.md`: Readme file for the mpich image
      - `lumi-multitorch-mpich-u24r70f21m50t210-20260513_121430.json`: Software Bill of materials for the mpich image
      - `lumi-multitorch-libfabric-u24r70f21m50t210-20260513_121430.sif`: SIF image for the libfabric image
      - `lumi-multitorch-libfabric-u24r70f21m50t210-20260513_121430.md`: Readme file for the libfabric image
      - `lumi-multitorch-libfabric-u24r70f21m50t210-20260513_121430.json`: Software Bill of materials for the libfabric image
      - `lumi-multitorch-rocm-u24r70f21m50t210-20260513_121430.sif`: SIF image for the rocm image
      - `lumi-multitorch-rocm-u24r70f21m50t210-20260513_121430.md`: Readme file for the rocm image
      - `lumi-multitorch-rocm-u24r70f21m50t210-20260513_121430.json`: Software Bill of materials for the rocm image
      
  Illustrative example use on LUMI:
    ```
    uan:~> srun --gpus-per-task=2 <other srun args> singularity \
      run <singularity args> <path to sif image> \
        python -c 'import torch; print("num gpus:", torch.cuda.device_count())'
    [...]
    num gpus: 2
    ```

  On Docker Hub the images are available with the following tag/naming scheme:
    - The exact images from this recipe build:
      - Image plus: `lumiaifactory/lumi-multitorch:plus-u24r70f21m50t210-20260513_121430`
      - Image full: `lumiaifactory/lumi-multitorch:full-u24r70f21m50t210-20260513_121430`
      - Image torch: `lumiaifactory/lumi-multitorch:torch-u24r70f21m50t210-20260513_121430`
      - Image mpich: `lumiaifactory/lumi-multitorch:mpich-u24r70f21m50t210-20260513_121430`
      - Image libfabric: `lumiaifactory/lumi-multitorch:libfabric-u24r70f21m50t210-20260513_121430`
      - Image rocm: `lumiaifactory/lumi-multitorch:rocm-u24r70f21m50t210-20260513_121430`
    - Latest build with specific significant software versions (using software digest):
      - Image plus:  `lumiaifactory/lumi-multitorch:plus-u24r70f21m50t210`
      - Image full:  `lumiaifactory/lumi-multitorch:full-u24r70f21m50t210`
      - Image torch:  `lumiaifactory/lumi-multitorch:torch-u24r70f21m50t210`
      - Image mpich:  `lumiaifactory/lumi-multitorch:mpich-u24r70f21m50t210`
      - Image libfabric:  `lumiaifactory/lumi-multitorch:libfabric-u24r70f21m50t210`
      - Image rocm:  `lumiaifactory/lumi-multitorch:rocm-u24r70f21m50t210`
    - Floating tags for latest version (over any significant software versions / digests):
      - `lumiaifactory/lumi-multitorch:plus`: latest complete plus image across all variants
      - `lumiaifactory/lumi-multitorch:full`: latest complete full image across all variants
      - `lumiaifactory/lumi-multitorch:torch`: latest complete torch image across all variants
      - `lumiaifactory/lumi-multitorch:mpich`: latest complete mpich image across all variants
      - `lumiaifactory/lumi-multitorch:libfabric`: latest complete libfabric image across all variants
      - `lumiaifactory/lumi-multitorch:rocm`: latest complete rocm image across all variants
    - Example Docker Hub pull commands:
      - `docker pull lumiaifactory/lumi-multitorch:full-u24r70f21m50t210-20260513_121430`
