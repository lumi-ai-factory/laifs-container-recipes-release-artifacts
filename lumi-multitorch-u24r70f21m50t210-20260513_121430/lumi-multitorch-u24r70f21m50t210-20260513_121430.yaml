- name: lumi-multitorch-full-u24r70f21m50t210
  base: lumi-multitorch-torch-u24r70f21m50t210
  desc: |
    **Overview**
    This is a multipurpose ML/AI image that builds on its base image by adding a
    comprehensive selection of tools and libraries for machine learning and AI
    workloads. The image is optimized to run on LUMI but should also work on other
    systems with MI250x GPUs and Slingshot interconnect.

    **Details**
    Base image: lumi-multitorch-torch-u24r70f21m50t210
    GPU architectures: gfx90a
    Components:
      - Apex (from https://github.com/ROCm/apex commit 73423b4)
      - Causal Conv1D (from https://github.com/Dao-AILab/causal-conv1d commit 0d2252d)
      - DeepSpeed 0.18.9 (with locally built ops addons)
      - Flash Attention (from https://github.com/ROCm/flash-attention commit bbe25ba)
      - LLM Compressor: (from https://github.com/vllm-project/llm-compressor commit 5a1552e)
      - Megatron LM (experimental): (from https://github.com/viahlgre/Megatron-LM commit c333868)
      - vLLM v0.20.1 (from https://github.com/vllm-project/vllm commit 132765e)
      - xFormers (from https://github.com/facebookresearch/xformers commit 03b91d7)

    Additional Python packages from PyPI:
      - accelerate
      - bitsandbytes
      - datasets
      - evaluate
      - h5py
      - huggingface-hub
      - jupyter
      - lightning
      - matplotlib
      - mlflow
      - mpi4py
      - numba
      - numpy
      - pandas
      - peft
      - scipy
      - sentence-transformers
      - sentencepiece
      - tensorboard
      - trl
      - ultralytics-opencv-headless

  template: multi/Rocm_Multipurpose
  force: false
  env:
  - APEX_GIT_REPO=https://github.com/ROCm/apex
