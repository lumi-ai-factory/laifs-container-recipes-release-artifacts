    \ commit bbe25ba)\n  - LLM Compressor: (from https://github.com/vllm-project/llm-compressor\
    \ commit 5a1552e)\n  - Megatron LM (experimental): (from https://github.com/viahlgre/Megatron-LM\
    \ commit c333868)\n  - vLLM v0.20.1 (from https://github.com/vllm-project/vllm\
    \ commit 132765e)\n  - xFormers (from https://github.com/facebookresearch/xformers\
    \ commit 03b91d7)\n\nThese additional packages from PyPI are also included in\
