    \  - tensorboard\n  - trl\n  - ultralytics-opencv-headless\n\n\n### Image lumi-multitorch-plus-u24r70f21m50t210-20260513_121430\n\
    \n**Overview**\nThis experimental image builds on the full image by adding various\
