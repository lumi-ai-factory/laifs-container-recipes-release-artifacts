steps:
- name: lumi-multitorch-rocm-u24r70f21m50t210
  base: ubuntu:noble-20260324
  desc: |
    **Overview**
    This is a base image building on Ubuntu 24.04 LTS upstream image
    with ROCm software from AMD's official Ubuntu repositories installed on top of
    it. The image also adds a few commonly used extra Ubuntu packages and enables
    man pages.

    **Details**
    Ubuntu base image: ubuntu:noble-20260324
    AMD ROCm repository: https://repo.radeon.com/rocm
    AMD ROCm release: 7.0.2
    Additional Ubuntu packages:
      - file
      - git
      - jq
      - less
      - lsof
      - nano
      - neovim
      - python3-dev
      - python3-packaging
      - python3-pip
      - python3-venv
      - screen
      - tmux
      - unzip
      - wget
  template: rocm/Ubuntu2404_Rocm6
  force: false
  env:
  - AMDGPU_REPO=https://repo.radeon.com/amdgpu
  - AMDGPU_VERSION=6.4.4
  - ROCM_REPO=https://repo.radeon.com/rocm
  - ROCM_VERSION=7.0.2
  - EXTRA_LOCALES="cs_CZ.UTF-8 da_DK.UTF-8 en_US.UTF-8 et_EE.UTF-8 fi_FI.UTF-8 nb_NO.UTF-8
    nn_NO.UTF-8 pl_PL.UTF-8"
  - EXTRA_PACKAGES="file git jq less lsof nano neovim python3-dev python3-packaging
    python3-pip python3-venv screen tmux unzip wget"
  export:
    def:
  cf_hash: 71445e261e1fd8559a9e09006a9a03ba3d512e15
  cf_lineage: 71445e261e1fd8559a9e09006a9a03ba3d512e15
  cf_text: "ARG BASE_IMAGE=ubuntu\nARG BASE_IMAGE_TAG=noble-20260324\nARG AMDGPU_REPO=https://repo.radeon.com/amdgpu\n\
    ARG AMDGPU_VERSION=6.4.4\nARG ROCM_REPO=https://repo.radeon.com/rocm\nARG ROCM_VERSION=7.0.2\n\
    ARG EXTRA_LOCALES=\"cs_CZ.UTF-8 da_DK.UTF-8 en_US.UTF-8 et_EE.UTF-8 fi_FI.UTF-8\
    \ nb_NO.UTF-8 nn_NO.UTF-8 pl_PL.UTF-8\"\nARG EXTRA_PACKAGES=\"file git jq less\
    \ lsof nano neovim python3-dev python3-packaging python3-pip python3-venv screen\
    \ tmux unzip wget\"\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\nARG BASE_IMAGE\nARG\
    \ BASE_IMAGE_TAG\n\nARG AMDGPU_REPO\nARG AMDGPU_VERSION\n\nARG ROCM_REPO\nARG\
    \ ROCM_VERSION\n\nARG EXTRA_LOCALES\nARG EXTRA_PACKAGES\n\nRUN set -ue; \\\n \
    \ #\n  # Enable man pages with unminimize and install additional locales\n  #\n\
    \  export DEBIAN_FRONTEND=noninteractive; \\\n  apt-get update; \\\n  yes | unminimize;\
    \ \\\n  apt-get -y --no-install-recommends install man locales; \\\n  locale-gen\
    \ ${EXTRA_LOCALES}; \\\n  #\n  # Add ROCm repository\n  #\n  apt-get install -y\
    \ --no-install-recommends ca-certificates curl gnupg; \\\n  #\n  printf \"Package:\
    \ *\\nPin: release o=repo.radeon.com\\nPin-Priority: 800\\n\" > /etc/apt/preferences.d/rocm-pin-prio-800;\
    \ \\\n  #\n  curl -sL ${ROCM_REPO}/rocm.gpg.key | apt-key add -; \\\n  #\n  printf\
    \ \"deb [arch=amd64] ${ROCM_REPO}/apt/${ROCM_VERSION}/ noble main\\n\" | tee --append\
    \ /etc/apt/sources.list.d/rocm.list; \\\n  printf \"deb [arch=amd64] ${AMDGPU_REPO}/${AMDGPU_VERSION}/ubuntu\
    \ noble main\\n\" | tee /etc/apt/sources.list.d/amdgpu.list; \\\n  #\n  # Install\
    \ ROCm packages\n  #\n  apt-get update; \\\n  apt-get install -y --no-install-recommends\
    \ build-essential cmake kmod libelf1 libnuma-dev pkgconf zstd; \\\n  apt-get install\
    \ -y --no-install-recommends amdgpu-dkms rocm-dev rocm-libs; \\\n  #\n  echo /opt/rocm/lib\
    \ > /etc/ld.so.conf.d/rocm-30.conf; \\\n  ldconfig; \\\n  #\n  # Install extra\
    \ packages\n  #\n  apt-get -y --no-install-recommends install ${EXTRA_PACKAGES};\
    \ \\\n  apt-get clean ;\\\n  rm -rf /var/lib/apt/lists/*; \\\n  #\n  # Workaround\
    \ for smi double free bug, see https://github.com/ROCm/rocm-systems/pull/2531\n\
    \  #\n  git clone --branch rocm-${ROCM_VERSION} https://github.com/ROCm/rocm_smi_lib\
    \ /tmp/rocm_smi_lib; \\\n  cd /tmp/rocm_smi_lib; \\\n  # Mark locally built package\
    \ by description\n  sed -i -e \"s/AMD System Management libraries/LUMI-AIF-$(date\
    \ -u +'%Y%m%d%H%M%S')/\" CMakeLists.txt; \\\n  # Patch the double free bug\n \
    \ curl -s https://github.com/ROCm/rocm-systems/commit/ad06de002ede9716f931d9b3052b17c59360b44f.patch\
    \ | \\\n    sed -e 's,projects/rocm-smi-lib/,,g' | git apply; \\\n  # Set the\
    \ lib versions manually for now. Hopefully we get rid of this whole workaround\
    \ soon.\n  git tag rsmi_pkg_ver-7.8.0; \\\n  git tag rsmi_so_ver-7.8.0; \\\n \
    \ #\n  mkdir build && cd build; \\\n  ROCM_LIBPATCH_VERSION=\"$(dpkg-query -W\
    \ -f='${Version}\\n' rocm-dev | sed -E 's/^[0-9]+\\.[0-9]+\\.[0-9]+\\.([0-9]+)-.*$/\\\
    1/')\" \\\n  CPACK_DEBIAN_PACKAGE_RELEASE=\"$(dpkg-query -W -f='${Version}\\n'\
    \ rocm-dev | sed -E 's/^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+-(.*)$/\\1/')\" \\\n\
    \  cmake -DCPACK_GENERATOR=DEB ..; \\\n  make -j $(nproc) package; \\\n  dpkg\
    \ -i rocm-smi-lib_*.deb; \\\n  cd /; \\\n  rm -rf /tmp/rocm_smi_lib; \\\n  #\n\
    \  # Add SBOM\n  #\n  apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\\
    n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version:\
    \ .[1]})')\"; \\\n  jq -n --argjson apt \"$apt_json\"  '{apt: $apt}' > /.sbom.json;\n\
    \nENV ROCM_PATH=/opt/rocm\n"

- name: lumi-multitorch-libfabric-u24r70f21m50t210
  base: lumi-multitorch-rocm-u24r70f21m50t210
  desc: |
    **Overview**
    This image builds on top of its base image by adding locally built Ubuntu
    packages to enable xpmem as well as libfabric functionality for HPE's Slingshot
    interconnect. It serves as a starting point for adding MPI capability to images
    built on top of it and can be a useful foundation for creating images with
    custom MPI stacks.

    **Details**
    Base image: lumi-multitorch-rocm-u24r70f21m50t210
    Components:
      - xpmem (from https://github.com/hpc/xpmem commit 3bcab55)
      - Cassini headers (from https://github.com/HewlettPackard/shs-cassini-headers release tgz for 12.0.1)
      - CXI headers (from https://github.com/HewlettPackard/shs-cxi-driver commit 27f7be5)
      - libcxi (from https://github.com/HewlettPackard/shs-libcxi commit 30fa2dd)
      - Libfabric 2.1 (from https://github.com/ofiwg/libfabric commit 78d6e03)
  template: libfabric/Ubuntu_Rocm_Slingshot
  force: false
  env:
  - XPMEM_CLONE_URL=https://github.com/hpc/xpmem
  - XPMEM_GIT_COMMIT=3bcab55
  - XPMEM_VERSION=0.1-3bcab55
  - XPMEM_KERNEL_BASE_SRC=linux-headers-6.8.0-92_6.8.0-92.94_all.deb
  - XPMEM_KERNEL_GENERIC_SRC=linux-headers-6.8.0-92-generic_6.8.0-92.94_amd64.deb
  - XPMEM_KERNEL_ID=linux-headers-6.8.0-92-generic
      #
  - CASSINI_HEADERS_SOURCE=https://github.com/HewlettPackard/shs-cassini-headers
  - CASSINI_HEADERS_VERSION=12.0.1
      #
  - CXI_HEADERS_VERSION=1.0.0-SHS12.0.2-27f7be5
  - CXI_HEADERS_CLONE_URL=https://github.com/HewlettPackard/shs-cxi-driver
  - CXI_HEADERS_GIT_COMMIT=27f7be5
      #
  - LIBCXI_VERSION=1.0.2-SHS12.0.2-30fa2dd
  - LIBCXI_CLONE_URL=https://github.com/HewlettPackard/shs-libcxi
  - LIBCXI_GIT_COMMIT=30fa2dd
      #
  - LIBFABRIC_VERSION=2.1-78d6e03
  - LIBFABRIC_CLONE_URL=https://github.com/ofiwg/libfabric
  - LIBFABRIC_GIT_COMMIT=78d6e03
  export:
    def:
  cf_hash: ee5256fbb52f7b36ee00fdd2d798795b2bf7454f
  cf_lineage: 71445e261e1fd8559a9e09006a9a03ba3d512e15,ee5256fbb52f7b36ee00fdd2d798795b2bf7454f
  cf_text: "ARG BASE_IMAGE=lumi-multitorch-rocm-u24r70f21m50t210\nARG XPMEM_CLONE_URL=https://github.com/hpc/xpmem\n\
    ARG XPMEM_GIT_COMMIT=3bcab55\nARG XPMEM_VERSION=0.1-3bcab55\nARG XPMEM_KERNEL_BASE_SRC=linux-headers-6.8.0-92_6.8.0-92.94_all.deb\n\
    ARG XPMEM_KERNEL_GENERIC_SRC=linux-headers-6.8.0-92-generic_6.8.0-92.94_amd64.deb\n\
    ARG XPMEM_KERNEL_ID=linux-headers-6.8.0-92-generic\nARG CASSINI_HEADERS_SOURCE=https://github.com/HewlettPackard/shs-cassini-headers\n\
    ARG CASSINI_HEADERS_VERSION=12.0.1\nARG CXI_HEADERS_VERSION=1.0.0-SHS12.0.2-27f7be5\n\
    ARG CXI_HEADERS_CLONE_URL=https://github.com/HewlettPackard/shs-cxi-driver\nARG\
    \ CXI_HEADERS_GIT_COMMIT=27f7be5\nARG LIBCXI_VERSION=1.0.2-SHS12.0.2-30fa2dd\n\
    ARG LIBCXI_CLONE_URL=https://github.com/HewlettPackard/shs-libcxi\nARG LIBCXI_GIT_COMMIT=30fa2dd\n\
    ARG LIBFABRIC_VERSION=2.1-78d6e03\nARG LIBFABRIC_CLONE_URL=https://github.com/ofiwg/libfabric\n\
    ARG LIBFABRIC_GIT_COMMIT=78d6e03\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG AS builder\n\
    \nARG CASSINI_HEADERS_SOURCE\nARG CASSINI_HEADERS_VERSION\n\nARG CXI_HEADERS_CLONE_URL\n\
    ARG CXI_HEADERS_GIT_COMMIT\nARG CXI_HEADERS_VERSION\n\nARG LIBCXI_CLONE_URL\n\
    ARG LIBCXI_GIT_COMMIT\nARG LIBCXI_VERSION\n\nARG LIBFABRIC_CLONE_URL\nARG LIBFABRIC_GIT_COMMIT\n\
    ARG LIBFABRIC_VERSION\n\nARG XPMEM_CLONE_URL\nARG XPMEM_GIT_COMMIT\nARG XPMEM_KERNEL_BASE_SRC\n\
    ARG XPMEM_KERNEL_GENERIC_SRC\nARG XPMEM_KERNEL_ID\nARG XPMEM_VERSION\n\nRUN set\
    \ -ue; \\\n    #\n    # Build requisites\n    #\n    export DEBIAN_FRONTEND=noninteractive;\
    \ \\\n    apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y\
    \ \\\n        autoconf \\\n        libconfig-dev \\\n        libcurl4-openssl-dev\
    \ \\\n        libfuse-dev \\\n        libjson-c-dev \\\n        libnl-3-dev \\\
    \n        libsensors-dev \\\n        libtool \\\n        libuv1-dev \\\n     \
    \   libyaml-dev \\\n        pkg-config \\\n        ruby \\\n        ruby-dev;\
    \ \\\n    gem install --no-document fpm; \\\n    mkdir /debs;\n\nRUN set -ue;\
    \ \\\n    #\n    # XPMEM\n    #\n    TMPROOT=$(mktemp -d); \\\n    #\n    XPMEM_KERNEL_PATH=${TMPROOT}/src/kernel/usr/src/${XPMEM_KERNEL_ID};\
    \ \\\n    #\n    install -d \"$TMPROOT/src\" \"$TMPROOT/src/kernel\"  \"$TMPROOT/usr\"\
    ; \\\n    cd \"$TMPROOT/src\"; \\\n    wget http://archive.ubuntu.com/ubuntu/pool/main/l/linux/${XPMEM_KERNEL_BASE_SRC};\
    \ \\\n    wget http://archive.ubuntu.com/ubuntu/pool/main/l/linux/${XPMEM_KERNEL_GENERIC_SRC};\
    \ \\\n    dpkg-deb -x ${XPMEM_KERNEL_BASE_SRC} kernel/; \\\n    dpkg-deb -x ${XPMEM_KERNEL_GENERIC_SRC}\
    \ kernel/; \\\n    #\n    git clone ${XPMEM_CLONE_URL} \"$TMPROOT/src/xpmem\"\
    ; \\\n    cd \"$TMPROOT/src/xpmem\"; \\\n    git checkout \"${XPMEM_GIT_COMMIT}\"\
    ; \\\n    ./autogen.sh; \\\n    ./configure --prefix=/usr --libdir /usr/lib/$(dpkg-architecture\
    \ -qDEB_HOST_MULTIARCH) --with-kerneldir=${XPMEM_KERNEL_PATH}; \\\n    make -j\
    \ \"$(nproc)\" DESTDIR=\"$TMPROOT\" install; \\\n    #\n    cd /debs; \\\n   \
    \ fpm -s dir -t deb -n xpmem -v \"${XPMEM_VERSION}\" --description \"LUMI-AIF-$(date\
    \ -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\" usr/include usr/lib; \\\n \
    \   dpkg -i \"xpmem_${XPMEM_VERSION}_amd64.deb\";\n\nRUN set -ue; \\\n    #\n\
    \    # Cassini headers\n    #\n    TMPROOT=$(mktemp -d); \\\n    CASSINI_HEADERS_TGZ=\"\
    shs-${CASSINI_HEADERS_VERSION}.tar.gz\"; \\\n    CASSINI_HEADERS_URL=\"${CASSINI_HEADERS_SOURCE}/archive/refs/tags/release/${CASSINI_HEADERS_TGZ}\"\
    ; \\\n    install -d \"$TMPROOT/usr/share/cassini-headers\" \"$TMPROOT/usr/include\"\
    \ \"$TMPROOT/src\"; \\\n    curl -L -o \"${TMPROOT}/src/${CASSINI_HEADERS_TGZ}\"\
    \ \"${CASSINI_HEADERS_URL}\"; \\\n    tar --transform='s|shs-cassini-headers-release-shs-[^/]*||'\
    \ -C \"${TMPROOT}/src\" -xzf \"${TMPROOT}/src/${CASSINI_HEADERS_TGZ}\"; \\\n \
    \   cp \"${TMPROOT}/src/share/cassini-headers/csr_defs.json\" \"$TMPROOT/usr/share/cassini-headers/\"\
    ; \\\n    cp -r \"${TMPROOT}\"/src/include/* \"$TMPROOT/usr/include/\"; \\\n \
    \   cd /debs; \\\n    fpm -s dir -t deb -n shs-cassini-headers -v \"${CASSINI_HEADERS_VERSION}\"\
    \ --description \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"\
    \ usr/include usr/share/cassini-headers; \\\n    rm -rf \"$TMPROOT\"; \\\n   \
    \ dpkg -i \"shs-cassini-headers_${CASSINI_HEADERS_VERSION}_amd64.deb\";\n\nRUN\
    \ set -ue; \\\n    #\n    # CXI headers\n    #\n    TMPROOT=$(mktemp -d); \\\n\
    \    install -d \"$TMPROOT/src\" \"$TMPROOT/usr/include\"; \\\n    git clone \"\
    ${CXI_HEADERS_CLONE_URL}\" \"$TMPROOT/src/shs-cxi-driver\"; \\\n    cd \"$TMPROOT/src/shs-cxi-driver\"\
    ; \\\n    git checkout \"${CXI_HEADERS_GIT_COMMIT}\"; \\\n    cp -r include/*\
    \ \"$TMPROOT/usr/include/\"; \\\n    cd /debs; \\\n    fpm -s dir -t deb -n shs-cxi-driver-dev\
    \ -v ${CXI_HEADERS_VERSION} --description \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\"\
    \ --prefix / -C \"$TMPROOT\" usr/include; \\\n    rm -rf \"$TMPROOT\"; \\\n  \
    \  dpkg -i shs-cxi-driver-dev_${CXI_HEADERS_VERSION}_amd64.deb;\n\nRUN set -ue;\
    \ \\\n    #\n    # Libcxi\n    #\n    TMPROOT=$(mktemp -d); \\\n    install -d\
    \ \"$TMPROOT/src\" \"$TMPROOT/usr\"; \\\n    git clone ${LIBCXI_CLONE_URL} \"\
    $TMPROOT/src/shs-libcxi\"; \\\n    cd \"$TMPROOT/src/shs-libcxi\"; \\\n    git\
    \ checkout \"${LIBCXI_GIT_COMMIT}\"; \\\n    ./autogen.sh; \\\n    ./configure\
    \ --with-udevrulesdir=/usr/lib/udev/rules.d --prefix=/usr --libdir /usr/lib/$(dpkg-architecture\
    \ -qDEB_HOST_MULTIARCH) --with-rocm=/opt/rocm ; \\\n    make -j \"$(nproc)\" DESTDIR=\"\
    $TMPROOT\" install; \\\n    cd /debs; \\\n    fpm -s dir -t deb -n libcxi -v ${LIBCXI_VERSION}\
    \ --description \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"\
    \ usr; \\\n    rm -rf \"$TMPROOT\"; \\\n    dpkg -i libcxi_${LIBCXI_VERSION}_amd64.deb;\n\
    \nRUN set -ue; \\\n    #\n    # Libfabric\n    #\n    TMPROOT=$(mktemp -d); \\\
    \n    install -d \"$TMPROOT/src\" \"$TMPROOT/usr\"; \\\n    git clone ${LIBFABRIC_CLONE_URL}\
    \ \"$TMPROOT/src/libfabric\"; \\\n    cd \"$TMPROOT/src/libfabric\"; \\\n    git\
    \ checkout \"${LIBFABRIC_GIT_COMMIT}\"; \\\n    ./autogen.sh; \\\n    ./configure\
    \ LDFLAGS=-Wl,--build-id --prefix=/usr --enable-only --enable-rxm  --enable-rxd\
    \ --enable-shm --enable-hook_hmem --enable-dmabuf_peer_mem --enable-cxi=/usr --enable-lnx\
    \ --enable-xpmem=/usr --with-rocr=/opt/rocm --libdir /usr/lib/$(dpkg-architecture\
    \ -qDEB_HOST_MULTIARCH); \\\n    make -j \"$(nproc)\" DESTDIR=\"$TMPROOT\" install;\
    \ \\\n    cd /debs; \\\n    fpm -s dir -t deb -n libfabric -v ${LIBFABRIC_VERSION}\
    \ --description \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"\
    \ usr; \\\n    rm -rf \"$TMPROOT\"; \\\n    dpkg -i libfabric_${LIBFABRIC_VERSION}_amd64.deb\n\
    \nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\nCOPY --from=builder /debs/*.deb /tmp/debs/\n\
    \nRUN set -ue; \\\n    #\n    # Install the built Ubuntu packages and dependencies\n\
    \    #\n    apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y\
    \ \\\n        autoconf \\\n        libconfig-dev \\\n        libcurl4-openssl-dev\
    \ \\\n        libfuse-dev \\\n        libjson-c-dev \\\n        libnl-3-dev \\\
    \n        libsensors-dev \\\n        libtool \\\n        libuv1-dev \\\n     \
    \   libyaml-dev \\\n        pkg-config \\\n        strace; \\\n    dpkg -i /tmp/debs/*.deb;\
    \ \\\n    rm -rf /tmp/debs; \\\n    ln -s /usr/lib/x86_64-linux-gnu/libcurl.so.4.8.0\
    \ /usr/lib64/libcurl.so.4; \\\n    ldconfig; \\\n    #\n    # Add SBOM\n    #\n\
    \    apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\n' | jq -R -s 'split(\"\
    \\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version: .[1]})')\"; \\\n    jq\
    \ -n --argjson apt \"$apt_json\"  '{apt: $apt}' > /.sbom.json;\n\nRUN printf '#!/usr/bin/env\
    \ bash\\n\\\nif [ \"${SLURM_NNODES}\" = 1 ] && [ -z \"${SLURM_GPUS_ON_NODE}\"\
    \ ]; then\\n\\\n    export FI_HMEM_DISABLE_P2P=1\\n\\\nfi\\n\\\nexec \"$@\"\\\
    n' > /opt/oci-entrypoint.sh && chmod +x /opt/oci-entrypoint.sh\n\nENTRYPOINT [\"\
    /opt/oci-entrypoint.sh\"]\n\n# Make default runscript compatible with OCI entrypoint.\n\
    # This only needs to be set once in the container lineage, i.e.,\n# in the first\
    \ Containerfile that includes an entrypoint.\nENV SINGULARITY_NO_EVAL=1\n"

- name: lumi-multitorch-mpich-u24r70f21m50t210
  base: lumi-multitorch-libfabric-u24r70f21m50t210
  desc: |
    **Overview**
    This image builds on top of its base image by adding an MPI library with GPU
    support, based on an MPICH build. It also includes the AWS-OFI-NCCL plugin to
    enable RCCL communication over the interconnect network using libfabric. The
    rccl-tests and OSU micro-benchmarks suite are included for performance and
    functionality validation.

    **Details**
    Base image: lumi-multitorch-libfabric-u24r70f21m50t210
    MPI implementation: MPICH 5.0.1
    Components:
      - MPICH 5.0.1 (from http://www.mpich.org/static/downloads release tgz for 5.0.1)
      - AWS-OFI-NCCL 1.19.1-git-206c02c (from https://github.com/aws/aws-ofi-nccl commit 206c02c)
      - RCCL (from https://github.com/ROCm/rccl-tests commit 5272cd1)
      - OSU micro-benchmarks 7.5.2 (from https://mvapich.cse.ohio-state.edu/download/mvapich release tgz for 7.5.2)
  template: mpich/Ubuntu_Rocm_Slingshot
  force: false
  env:
  - AWS_OFI_NCCL_COMMIT=206c02c
  - AWS_OFI_NCCL_REPO=https://github.com/aws/aws-ofi-nccl
  - AWS_OFI_NCCL_VERSION=1.19.1-git-206c02c
      #
  - HWLOC_REPO=https://github.com/open-mpi/hwloc
  - HWLOC_VERSION=2.13.0
      #
  - MPICH_SOURCE=http://www.mpich.org/static/downloads
  - MPICH_VERSION=5.0.1
  - MPICH_GPU_ARCH=gfx90a
      #
  - OSU_SOURCE=https://mvapich.cse.ohio-state.edu/download/mvapich
  - OSU_VERSION=7.5.2
      #
  - RCCL_TESTS_COMMIT=5272cd1
  - RCCL_TESTS_GPU_ARCHS=gfx90a
  - RCCL_TESTS_REPO=https://github.com/ROCm/rccl-tests
  - RCCL_TESTS_VERSION=0.1-5272cd1
  export:
    def:
  cf_hash: 0428cb665bd928855eda9f0a3361d5ee3e3d4152
  cf_lineage: 71445e261e1fd8559a9e09006a9a03ba3d512e15,ee5256fbb52f7b36ee00fdd2d798795b2bf7454f,0428cb665bd928855eda9f0a3361d5ee3e3d4152
  cf_text: "ARG BASE_IMAGE=lumi-multitorch-libfabric-u24r70f21m50t210\nARG AWS_OFI_NCCL_COMMIT=206c02c\n\
    ARG AWS_OFI_NCCL_REPO=https://github.com/aws/aws-ofi-nccl\nARG AWS_OFI_NCCL_VERSION=1.19.1-git-206c02c\n\
    ARG HWLOC_REPO=https://github.com/open-mpi/hwloc\nARG HWLOC_VERSION=2.13.0\nARG\
    \ MPICH_SOURCE=http://www.mpich.org/static/downloads\nARG MPICH_VERSION=5.0.1\n\
    ARG MPICH_GPU_ARCH=gfx90a\nARG OSU_SOURCE=https://mvapich.cse.ohio-state.edu/download/mvapich\n\
    ARG OSU_VERSION=7.5.2\nARG RCCL_TESTS_COMMIT=5272cd1\nARG RCCL_TESTS_GPU_ARCHS=gfx90a\n\
    ARG RCCL_TESTS_REPO=https://github.com/ROCm/rccl-tests\nARG RCCL_TESTS_VERSION=0.1-5272cd1\n\
    \nFROM $BASE_IMAGE:$BASE_IMAGE_TAG AS builder\n\nARG AWS_OFI_NCCL_COMMIT\nARG\
    \ AWS_OFI_NCCL_REPO\nARG AWS_OFI_NCCL_VERSION\n\nARG BASE_IMAGE\nARG BASE_IMAGE_TAG\n\
    \nARG HWLOC_REPO\nARG HWLOC_VERSION\n\nARG MPICH_SOURCE\nARG MPICH_VERSION\nARG\
    \ MPICH_GPU_ARCH\n\nARG OSU_SOURCE\nARG OSU_VERSION\n\nARG RCCL_TESTS_COMMIT\n\
    ARG RCCL_TESTS_GPU_ARCHS\nARG RCCL_TESTS_REPO\nARG RCCL_TESTS_VERSION\n\n\n#\n\
    # Install FPM package builder using GEM (only for the builder image)\n#\n\nRUN\
    \ set -ue; \\\n  export DEBIAN_FRONTEND=noninteractive; \\\n  apt-get update;\
    \ \\\n  apt-get install -y ruby ruby-dev; \\\n  gem install --no-document fpm;\
    \ \\\n  mkdir /debs;\n\n\n#\n# Build and install hwloc (with rocm/amdgpu support)\
    \ into the builder container\n#\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d);\
    \ \\\n    git clone \"${HWLOC_REPO}\" \"$TMPROOT/hwloc\"; \\\n    cd  \"$TMPROOT/hwloc\"\
    ; \\\n    git checkout \"hwloc-${HWLOC_VERSION}\"; \\\n    ./autogen.sh; \\\n\
    \    ./configure --with-rocm=/opt/rocm --with-amdgpu=/opt/amdgpu --prefix=/usr\
    \ --libdir /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH) --disable-opencl\
    \ --disable-gl --enable-plugins=pci; \\\n    make -j $(nproc) DESTDIR=\"$TMPROOT\"\
    \ install; \\\n    cd /debs; \\\n    fpm -s dir -t deb -n libhwloc15 -v \"${HWLOC_VERSION}\"\
    \ --description \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"\
    \ \\\n        -x \"usr/include/*\" -x \"usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/pkgconfig/hwloc.pc\"\
    \ \\\n        -x \"usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/*.la\" -x\
    \ \"usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/hwloc/*\" usr; \\\n    fpm\
    \ -s dir -t deb -n libhwloc-dev -v \"${HWLOC_VERSION}\" --description \"LUMI-AIF-$(date\
    \ -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\" \\\n         usr/include usr/lib/$(dpkg-architecture\
    \ -qDEB_HOST_MULTIARCH)/pkgconfig/hwloc.pc \\\n         usr/lib/$(dpkg-architecture\
    \ -qDEB_HOST_MULTIARCH)/libhwloc.la; \\\n    fpm -s dir -t deb -n libhwloc-plugins\
    \ -v \"${HWLOC_VERSION}\" --description \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\"\
    \ \\\n        --prefix / -C \"$TMPROOT\" usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/hwloc;\
    \ \\\n    rm -rf \"$TMPROOT\"; \\\n    dpkg -i libhwloc*amd64.deb;\n\n\n#\n# Build\
    \ and install MPICH package into the builder container\n#\n\nRUN set -ue; \\\n\
    \  TMPROOT=$(mktemp -d); \\\n  MPICH_TGZ=\"mpich-${MPICH_VERSION}.tar.gz\"; \\\
    \n  MPICH_URL=\"${MPICH_SOURCE}/${MPICH_VERSION}/${MPICH_TGZ}\"; \\\n  install\
    \ -d \"$TMPROOT/usr\" \"$TMPROOT/src\"; \\\n  curl -L -o \"${TMPROOT}/src/${MPICH_TGZ}\"\
    \ \"${MPICH_URL}\"; \\\n  tar -C \"${TMPROOT}/src\" -xf \"${TMPROOT}/src/${MPICH_TGZ}\"\
    \ --no-same-owner; \\\n  cd \"${TMPROOT}/src/mpich-${MPICH_VERSION}\"; \\\n  ./configure\
    \ --disable-fortran --enable-fast=O3 --enable-threads=multiple --prefix=/usr --libdir\
    \ /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH) --with-device=ch4:ofi --with-hip=/opt/rocm\
    \ --with-libfabric --with-xpmem=/usr --without-cuda --without-ucx --with-hip-sm=${MPICH_GPU_ARCH};\
    \ \\\n  make -j $(nproc) DESTDIR=\"$TMPROOT\" install; \\\n  cd /debs; \\\n  fpm\
    \ -s dir -t deb -n mpich -v \"${MPICH_VERSION}\" --description \"LUMI-AIF-$(date\
    \ -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"  usr/bin usr/etc usr/include\
    \ usr/lib usr/share; \\\n  rm -rf \"$TMPROOT\"; \\\n  dpkg -i \"mpich_${MPICH_VERSION}_amd64.deb\"\
    ;\n\n\n#\n# Build and install OSU Benchmarks package into the builder container\n\
    #\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d); \\\n    OSU_TGZ=\"osu-micro-benchmarks-${OSU_VERSION}.tar.gz\"\
    ; \\\n    OSU_URL=\"${OSU_SOURCE}/${OSU_TGZ}\"; \\\n    install -d \"$TMPROOT/libexec\"\
    \ \"$TMPROOT/src\"; \\\n    curl -L -o \"${TMPROOT}/src/${OSU_TGZ}\" \"${OSU_URL}\"\
    ; \\\n    tar -C \"${TMPROOT}/src\" -xf \"${TMPROOT}/src/${OSU_TGZ}\" --no-same-owner;\
    \ \\\n    cd \"${TMPROOT}/src/osu-micro-benchmarks-${OSU_VERSION}\"; \\\n    ./configure\
    \ --prefix=/usr CC=mpicc CXX=mpicxx --enable-rocm --with-rocm=/opt/rocm; \\\n\
    \    make -j $(nproc) DESTDIR=\"$TMPROOT\" install; \\\n    cd /debs; \\\n   \
    \ fpm -s dir -t deb -n osu-micro-benchmarks -v \"${OSU_VERSION}\" --description\
    \ \"LUMI-AIF-$(date -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"  usr/libexec;\
    \ \\\n    rm -rf \"$TMPROOT\"; \\\n    dpkg -i \"osu-micro-benchmarks_${OSU_VERSION}_amd64.deb\"\
    \n\n\n#\n# Build and install AWS-OFI-NCCL package into the builder container\n\
    #\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d); \\\n    git clone \"${AWS_OFI_NCCL_REPO}\"\
    \ \"$TMPROOT/aws-ofi-nccl\"; \\\n    cd  \"$TMPROOT/aws-ofi-nccl\"; \\\n    git\
    \ checkout \"${AWS_OFI_NCCL_COMMIT}\"; \\\n    ./autogen.sh; \\\n    ./configure\
    \ --with-rocm=/opt/rocm --enable-trace --disable-tests --prefix=/usr --libdir\
    \ /usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH); \\\n    make -j $(nproc)\
    \ DESTDIR=\"$TMPROOT\" install; \\\n    cd /debs; \\\n    fpm -s dir -t deb -n\
    \ aws-ofi-nccl -v \"${AWS_OFI_NCCL_VERSION}\" --description \"LUMI-AIF-$(date\
    \ -u +'%Y%m%d%H%M%S')\" --prefix / -C \"$TMPROOT\"  usr/lib; \\\n    rm -rf \"\
    $TMPROOT\"; \\\n    dpkg -i \"aws-ofi-nccl_${AWS_OFI_NCCL_VERSION}_amd64.deb\"\
    ;\n\n\n#\n# Build and install rccl-tests package into the builder container\n\
    #\n\nRUN set -ue; \\\n    TMPROOT=$(mktemp -d); \\\n    git clone \"${RCCL_TESTS_REPO}\"\
    \ \"$TMPROOT/rccl-tests\"; \\\n    cd  \"$TMPROOT/rccl-tests\"; \\\n    git checkout\
    \ \"${RCCL_TESTS_COMMIT}\"; \\\n    make -j $(nproc) MPI=1 GPU_TARGETS=\"${RCCL_TESTS_GPU_ARCHS}\"\
    ; \\\n    install -d \"${TMPROOT}/libexec/rccl-tests\"; \\\n    cp build/*_perf\
    \ \"${TMPROOT}/libexec/rccl-tests\"; \\\n    cd /debs; \\\n    fpm -s dir -t deb\
    \ -n rccl-tests -v \"${RCCL_TESTS_VERSION}\" --description \"LUMI-AIF-$(date -u\
    \ +'%Y%m%d%H%M%S')\" --prefix /usr -C \"$TMPROOT\" libexec; \\\n    rm -rf \"\
    $TMPROOT\"; \\\n    dpkg -i \"rccl-tests_${RCCL_TESTS_VERSION}_amd64.deb\"\n\n\
    \n#\n# Copy the Debian packages created in the previous steps from the builder\
    \ image to\n# the final image and install them.\n#\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\
    \nCOPY --from=builder /debs/*.deb /tmp/debs/\n\nRUN set -ue; \\\n    #\n    #\
    \ Install all built Ubuntu packages\n    #\n    dpkg -i /tmp/debs/*.deb; \\\n\
    \    rm -rf /tmp/debs; \\\n    #\n    # Add SBOM\n    #\n    apt_json=\"$(dpkg-query\
    \ -W -f='${Package}\\t${Version}\\n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\
    \\t\") | {name: .[0], version: .[1]})')\"; \\\n    jq -n --argjson apt \"$apt_json\"\
    \  '{apt: $apt}' > /.sbom.json;\n\nENV MPIR_CVAR_CH4_OFI_ENABLE_HMEM=1\nENV MPIR_CVAR_CH4_OFI_ENABLE_MR_HMEM=1\n\
    ENV MPIR_CVAR_ENABLE_GPU=1\n\nRUN printf '#!/usr/bin/env bash\\n\\\nif [ \"${SLURM_NNODES}\"\
    \ = 1 ] && [ -z \"${SLURM_GPUS_ON_NODE}\" ]; then\\n\\\n    export FI_HMEM_DISABLE_P2P=1\\\
    n\\\nfi\\n\\\nexec \"$@\"\\n' > /opt/oci-entrypoint.sh && chmod +x /opt/oci-entrypoint.sh\n\
    \nENTRYPOINT [\"/opt/oci-entrypoint.sh\"]\n"

- name: lumi-multitorch-torch-u24r70f21m50t210
  base: lumi-multitorch-mpich-u24r70f21m50t210
  desc: |
    **Overview**
    This image builds on top of its base image by adding PyTorch for AMD GPUs and
    ROCm, along with few related packages from PyTorch's upstream repositories.

    **Details**
    Base image: lumi-multitorch-mpich-u24r70f21m50t210
    PyTorch version: 2.10.0
    PyTorch packages and sources:
      - PyTorch: "https://github.com/pytorch/pytorch @ tag v2.10.0"
