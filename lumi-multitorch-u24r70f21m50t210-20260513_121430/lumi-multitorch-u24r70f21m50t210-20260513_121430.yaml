    \ Install llmcompressor\n#\nRUN set -ue; \\\n  . /opt/venv/bin/activate; \\\n\
    \  pip wheel --no-deps -w /opt/src/llmcompressor git+${LLMCOMPRESSOR_REPO}.git@${LLMCOMPRESSOR_COMMIT};\
    \ \\\n  wheel_path=\"$(find /opt/src/llmcompressor -mindepth 1 -maxdepth 1 -type\
    \ f -name '*.whl')\"; \\\n  test $(echo $wheel_path | wc -w) = 1; \\\n  new_wheel=\"\
    $(wretag -d -q lumi_aif_${LLMCOMPRESSOR_COMMIT} $wheel_path)\"; \\\n  pip install\
    \ $new_wheel; \\\n  cd / && rm -rf /opt/src/llmcompressor;\n\n\n#\n# Install Deepspeed\n\
    #\n\nRUN set -ue; \\\n  . /opt/venv/bin/activate; \\\n  export PYTORCH_ROCM_ARCH=$MULTI_IMAGE_GPU_ARCH;\
    \ \\\n  export DS_ACCELERATOR=cuda; \\\n  export DS_BUILD_OPS=1; \\\n  #\n  #\
    \ Some extensions need to be disabled\n  #\n  # https://github.com/deepspeedai/DeepSpeed/issues/7843#issuecomment-3896637925\n\
    \  #\n  export DS_BUILD_INFERENCE_CORE_OPS=0; \\\n  export DS_BUILD_CUTLASS_OPS=0;\
    \ \\\n  export DS_BUILD_RAGGED_DEVICE_OPS=0; \\\n  export DS_BUILD_RAGGED_OPS=0;\
    \ \\\n  #\n  python3 -m pip wheel deepspeed==${DEEPSPEED_VERSION} --no-deps --no-build-isolation\
    \ -w /tmp/deepspeed; \\\n  wheel_path=\"$(find /tmp/deepspeed  -mindepth 1 -maxdepth\
    \ 1 -type f -name '*.whl')\"; \\\n  test $(echo $wheel_path | wc -w) = 1; \\\n\
    \  new_wheel=\"$(wretag -d -q lumi_aif_dsops $wheel_path)\"; \\\n  pip install\
    \ $new_wheel; \\\n  cd / && rm -rf /tmp/deepspeed;\n\n\n#\n# Install Megatron\
    \ LM (experimental for testing)\n#\n\nRUN set -ue; \\\n  . /opt/venv/bin/activate;\
    \ \\\n  pip wheel --no-deps -w /opt/src/megatronlm git+${MEGATRON_LM_REPO_URL}.git@${MEGATRON_LM_COMMIT};\
    \ \\\n  wheel_path=\"$(find /opt/src/megatronlm -mindepth 1 -maxdepth 1 -type\
    \ f -name '*.whl')\"; \\\n  test $(echo $wheel_path | wc -w) = 1; \\\n  new_wheel=\"\
    $(wretag -d -q lumi_aif_${MEGATRON_LM_COMMIT} $wheel_path)\"; \\\n  pip install\
    \ $new_wheel; \\\n  cd / && rm -rf /opt/src/megatronlm;\n\n\n#\n# Cleanup and\
    \ finalize\n#\nRUN set -ue; \\\n  #\n  rmdir /opt/src; \\\n  #\n  test -f /opt/rocm/lib/llvm/bin/amdgpu-arch.really\
    \ || { echo \"error: amdgpu-arch.really is missing\"; false; }; \\\n  rm /opt/rocm/lib/llvm/bin/amdgpu-arch;\
    \ \\\n  mv /opt/rocm/lib/llvm/bin/amdgpu-arch.really /opt/rocm/lib/llvm/bin/amdgpu-arch;\
    \ \\\n  # Add SBOM\n  apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\\
    n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version:\
    \ .[1]})')\"; \\\n  pip_json=\"$(pip list --format=json)\"; \\\n  jq -n --argjson\
    \ apt \"$apt_json\"  --argjson pip \"$pip_json\" '{apt: $apt, pip: $pip}' > /.sbom.json;\n\
    \n\nRUN printf '#!/usr/bin/env bash\\n\\\nif [ \"${SLURM_NNODES}\" = 1 ] && [\
    \ -z \"${SLURM_GPUS_ON_NODE}\" ]; then\\n\\\n    export FI_HMEM_DISABLE_P2P=1\\\
    n\\\nfi\\n\\\nif [ \"${ROCR_USE_SLURM_LOCALID}\" = 1 ] && [ -n \"${SLURM_LOCALID}\"\
    \ ]; then\\n\\\n    export ROCR_VISIBLE_DEVICES=\"$SLURM_LOCALID\"\\n\\\nfi\\\
    n\\\nif [ \"${MAP_HIP_TO_ROCR_VISIBLE_DEVICES}\" = 1 ] && [ -n \"${ROCR_VISIBLE_DEVICES}\"\
    \ ]; then\\n\\\n    export HIP_VISIBLE_DEVICES=`seq -s , 0 $(echo \"${ROCR_VISIBLE_DEVICES%%,}\"\
    \ | awk -F, '\\''{print NF-1}'\\'')`\\n\\\nfi\\n\\\nexec \"$@\"\\n' > /opt/oci-entrypoint.sh\
    \ && chmod +x /opt/oci-entrypoint.sh\n\nENTRYPOINT [\"/opt/oci-entrypoint.sh\"\
    ]\n"

- name: lumi-multitorch-plus-u24r70f21m50t210
  base: lumi-multitorch-full-u24r70f21m50t210
  desc: |
    **Overview**
    This experimental image builds on the full image by adding various additional
    ML/AI libraries for testing purposes. It serves as a technology preview for
    evaluating potential future additions to the full image and as a home for some
    software components that are more difficult to maintain long term. The included
    additional software may be removed without warning in minor image releases, and
    the image is not intended for long-term use. To satisfy dependencies, some
    libraries of the full image may be also downgraded in this image.

    **Details**
    Base image: lumi-multitorch-full-u24r70f21m50t210
    GPU architectures: gfx90a
    Components:
      - TransformerEngine (from https://github.com/ROCm/TransformerEngine commit 2.8_rocm)
  template: plus/Plus
  force: false
  env:
  - TRANSFORMER_ENGINE_ARCH=gfx90a
  - TRANSFORMER_ENGINE_COMMIT=2.8_rocm
  - TRANSFORMER_ENGINE_REPO=https://github.com/ROCm/TransformerEngine
  export:
    def:
  cf_hash: b97027b6fced9307ca23b88c831fb793591f55b3
  cf_lineage: 71445e261e1fd8559a9e09006a9a03ba3d512e15,ee5256fbb52f7b36ee00fdd2d798795b2bf7454f,0428cb665bd928855eda9f0a3361d5ee3e3d4152,949c5576caafbd7fd9771673b77d9cd3862ef98a,83cfb05755d1055fa93c7ed5180b49620216b930,b97027b6fced9307ca23b88c831fb793591f55b3
  cf_text: "ARG BASE_IMAGE=lumi-multitorch-full-u24r70f21m50t210\nARG TRANSFORMER_ENGINE_ARCH=gfx90a\n\
    ARG TRANSFORMER_ENGINE_COMMIT=2.8_rocm\nARG TRANSFORMER_ENGINE_REPO=https://github.com/ROCm/TransformerEngine\n\
    \nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\nARG BASE_IMAGE\nARG BASE_IMAGE_TAG\n\nARG\
    \ TRANSFORMER_ENGINE_ARCH\nARG TRANSFORMER_ENGINE_COMMIT\nARG TRANSFORMER_ENGINE_REPO\n\
    \nRUN set -ue; \\\n  #\n  export AOTRITON_TARGET_ARCH=${TRANSFORMER_ENGINE_ARCH};\
    \ \\\n  #\n  export CMAKE_PREFIX_PATH=/opt/rocm; \\\n  #\n  export GPU_ARCHS=${TRANSFORMER_ENGINE_ARCH};\
    \ \\\n  export GPU_TARGETS=${TRANSFORMER_ENGINE_ARCH}; \\\n  #\n  export NVTE_ROCM_ARCH=${TRANSFORMER_ENGINE_ARCH};\
    \ \\\n  export NVTE_FRAMEWORK=pytorch; \\\n  export NVTE_FUSED_ATTN=0; \\\n  #\n\
    \  git clone --recursive --branch \"v${TRANSFORMER_ENGINE_COMMIT}\" ${TRANSFORMER_ENGINE_REPO}\
    \ /opt/src/transformer_engine; \\\n  #\n  cd /opt/src/transformer_engine; \\\n\
    \  #\n  . /opt/venv/bin/activate; \\\n  # --no-build-isolation needed for pytorch\
    \ HIP support detection\n  pip install . --no-build-isolation;\n\nRUN printf '#!/usr/bin/env\
    \ bash\\n\\\nif [ \"${SLURM_NNODES}\" = 1 ] && [ -z \"${SLURM_GPUS_ON_NODE}\"\
    \ ]; then\\n\\\n    export FI_HMEM_DISABLE_P2P=1\\n\\\nfi\\n\\\nif [ \"${ROCR_USE_SLURM_LOCALID}\"\
    \ = 1 ] && [ -n \"${SLURM_LOCALID}\" ]; then\\n\\\n    export ROCR_VISIBLE_DEVICES=\"\
    $SLURM_LOCALID\"\\n\\\nfi\\n\\\nif [ \"${MAP_HIP_TO_ROCR_VISIBLE_DEVICES}\" =\
    \ 1 ] && [ -n \"${ROCR_VISIBLE_DEVICES}\" ]; then\\n\\\n    export HIP_VISIBLE_DEVICES=`seq\
    \ -s , 0 $(echo \"${ROCR_VISIBLE_DEVICES%%,}\" | awk -F, '\\''{print NF-1}'\\\
    '')`\\n\\\nfi\\n\\\nexec \"$@\"\\n' > /opt/oci-entrypoint.sh && chmod +x /opt/oci-entrypoint.sh\n\
    \nENTRYPOINT [\"/opt/oci-entrypoint.sh\"]\n"

