    \nARG SRC_DIR=\"/opt/src\"\n\nENV NVTE_FRAMEWORK=pytorch\n\nRUN --mount=type=secret,id=github-netrc,target=/root/.netrc,mode=0600\
    \ \\\n  set -ue; \\\n  #\n  export AOTRITON_TARGET_ARCH=${TRANSFORMER_ENGINE_ARCH};\
