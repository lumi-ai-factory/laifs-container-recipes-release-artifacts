    \ \\\n  export VLLM_TARGET_DEVICE=rocm; \\\n  export PYTORCH_ROCM_ARCH=$MULTI_IMAGE_GPU_ARCH;\
    \ \\\n  export VLLM_VERSION_OVERRIDE=${VLLM_VERSION}+lumi_aif_${MULTI_IMAGE_GPU_ARCH}_${VLLM_COMMIT};\
    \ \\\n  #\n  python setup.py bdist_wheel -v --dist-dir=dist; \\\n  wheel_path=\"\
    $(find ${SRC_DIR}/vllm/dist  -mindepth 1 -maxdepth 1 -type f -name '*.whl')\"\
    ; \\\n  test $(echo $wheel_path | wc -w) = 1; \\\n  #\n  cd .. && pip install\
    \ $wheel_path; \\\n  rm -rf ${SRC_DIR}/vllm;\n\n#\n# Install llmcompressor\n#\n\
    ARG LLMCOMPRESSOR_REPO\nARG LLMCOMPRESSOR_COMMIT\n\nRUN set -ue; \\\n  export\
    \ MAX_JOBS=\"${MAX_JOBS:-$(nproc)}\"; \\\n  #Pins Python library versions that\
    \ are incompatible with vLLM\n  export BUILD_TYPE=release; \\\n  #\n  pip wheel\
    \ --no-deps -v -w ${SRC_DIR}/llmcompressor git+${LLMCOMPRESSOR_REPO}.git@${LLMCOMPRESSOR_COMMIT};\
    \ \\\n  wheel_path=\"$(find ${SRC_DIR}/llmcompressor -mindepth 1 -maxdepth 1 -type\
    \ f -name '*.whl')\"; \\\n  test $(echo $wheel_path | wc -w) = 1; \\\n  new_wheel=\"\
    $(wretag -d -q lumi_aif_${LLMCOMPRESSOR_COMMIT} $wheel_path)\"; \\\n  #\n  cd\
    \ .. && pip install $new_wheel; \\\n  rm -rf ${SRC_DIR}/llmcompressor;\n\n#\n\
    # Install Deepspeed\n#\nARG DEEPSPEED_VERSION\n\nRUN set -ue; \\\n  export MAX_JOBS=\"\
    ${MAX_JOBS:-$(nproc)}\"; \\\n  #\n  src=${SRC_DIR}/deepspeed && \\\n  mkdir -p\
    \ $src && \\\n  python -m pip download \\\n    \"deepspeed==${DEEPSPEED_VERSION}\"\
    \ \\\n    --no-deps \\\n    --no-binary=:all: \\\n    -d \"$src\"; \\\n  #\n \
    \ export PYTORCH_ROCM_ARCH=$MULTI_IMAGE_GPU_ARCH; \\\n  export DS_ACCELERATOR=cuda;\
    \ \\\n  export DS_BUILD_OPS=1; \\\n  #\n  # Some extensions need to be disabled\n\
    \  #\n  # https://github.com/deepspeedai/DeepSpeed/issues/7843#issuecomment-3896637925\n\
    \  #\n  export DS_BUILD_INFERENCE_CORE_OPS=0; \\\n  export DS_BUILD_CUTLASS_OPS=0;\
    \ \\\n  export DS_BUILD_RAGGED_DEVICE_OPS=0; \\\n  export DS_BUILD_RAGGED_OPS=0;\
    \ \\\n  export DS_BUILD_STRING=\"+lumi_aif_dsops\"; \\\n  #\n  python -m pip wheel\
    \ \\\n    \"$src/deepspeed-${DEEPSPEED_VERSION}.tar.gz\" \\\n    --no-deps \\\n\
    \    --no-build-isolation \\\n    -w ${src}/dist && \\\n  wheel_path=\"$(find\
    \ ${src}/dist  -mindepth 1 -maxdepth 1 -type f -name '*.whl')\" && \\\n  test\
    \ $(echo $wheel_path | wc -w) = 1 && \\\n  pip install $wheel_path && \\\n  ds_report;\
    \ \\\n  #\n  rm -rf ${SRC_DIR}/deepspeed;\n\n#\n# Install Megatron LM (experimental\
    \ for testing)\n#\nARG MEGATRON_LM_REPO_URL\nARG MEGATRON_LM_COMMIT\n\nRUN set\
    \ -ue; \\\n  export MAX_JOBS=\"${MAX_JOBS:-$(nproc)}\"; \\\n  #\n  pip wheel --no-deps\
    \ -w ${SRC_DIR}/megatronlm git+${MEGATRON_LM_REPO_URL}.git@${MEGATRON_LM_COMMIT};\
    \ \\\n  wheel_path=\"$(find ${SRC_DIR}/megatronlm -mindepth 1 -maxdepth 1 -type\
    \ f -name '*.whl')\"; \\\n  test $(echo $wheel_path | wc -w) = 1; \\\n  new_wheel=\"\
    $(wretag -d -q lumi_aif_${MEGATRON_LM_COMMIT} $wheel_path)\"; \\\n  pip install\
    \ $new_wheel; \\\n  #\n  # Fix python -c \"from megatron.core.datasets.utils import\
    \ compile_helpers; compile_helpers()\"\n  DIR=/opt/venv/lib/python3.12/site-packages/megatron/core/datasets\
    \ && \\\n  printf 'all:\\n\\t@ls helpers_cpp*.so >/dev/null 2>&1 || { echo \"\
    helpers_cpp .so missing\" >&2; exit 1; }\\n' > \"$DIR/Makefile\"; \\\n  #\n  rm\
    \ -rf ${SRC_DIR}/megatronlm;\n\n#\n# Cleanup and finalize\n#\nRUN set -ue; \\\n\
    \  #\n  rm -rf ${SRC_DIR}; \\\n  #\n  test -f /opt/rocm/lib/llvm/bin/amdgpu-arch.really\
    \ || { echo \"error: amdgpu-arch.really is missing\"; false; }; \\\n  rm /opt/rocm/lib/llvm/bin/amdgpu-arch;\
    \ \\\n  mv /opt/rocm/lib/llvm/bin/amdgpu-arch.really /opt/rocm/lib/llvm/bin/amdgpu-arch;\
    \ \\\n  # Add SBOM\n  apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\\
    n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version:\
    \ .[1]})')\"; \\\n  pip_json=\"$(pip list --format=json)\"; \\\n  jq -n --argjson\
    \ apt \"$apt_json\"  --argjson pip \"$pip_json\" '{apt: $apt, pip: $pip}' > /.sbom.json;\n\
    \n\nRUN printf '#!/usr/bin/env bash\\n\\\nif [ \"${SLURM_NNODES}\" = 1 ] && [\
    \ -z \"${SLURM_GPUS_ON_NODE}\" ]; then\\n\\\n    export FI_HMEM_DISABLE_P2P=1\\\
    n\\\nfi\\n\\\nif [ \"${ROCR_USE_SLURM_LOCALID}\" = 1 ] && [ -n \"${SLURM_LOCALID}\"\
    \ ]; then\\n\\\n    export ROCR_VISIBLE_DEVICES=\"$SLURM_LOCALID\"\\n\\\nfi\\\
    n\\\nif [ \"${MAP_HIP_TO_ROCR_VISIBLE_DEVICES}\" = 1 ] && [ -n \"${ROCR_VISIBLE_DEVICES}\"\
    \ ]; then\\n\\\n    export HIP_VISIBLE_DEVICES=`seq -s , 0 $(echo \"${ROCR_VISIBLE_DEVICES%%,}\"\
    \ | awk -F, '\\''{print NF-1}'\\'')`\\n\\\nfi\\n\\\nexec \"$@\"\\n' > /opt/oci-entrypoint.sh\
    \ && chmod +x /opt/oci-entrypoint.sh\n\nENTRYPOINT [\"/opt/oci-entrypoint.sh\"\
    ]\n"

- name: lumi-multitorch-plus-u24r72f21m50t211
  base: lumi-multitorch-full-u24r72f21m50t211
  desc: |
    **Overview**
    This experimental image builds on the full image by adding various additional
    ML/AI libraries for testing purposes. It serves as a technology preview for
    evaluating potential future additions to the full image and as a home for some
    software components that are more difficult to maintain long term. The included
    additional software may be removed without warning in minor image releases, and
    the image is not intended for long-term use. To satisfy dependencies, some
    libraries of the full image may be also downgraded in this image.

    **Details**
    Base image: lumi-multitorch-full-u24r72f21m50t211
    GPU architectures: gfx90a
    Components:
      - TransformerEngine (from https://github.com/ROCm/TransformerEngine commit e7835ed)
  template: plus/Plus
  force: false
  env:
  - TRANSFORMER_ENGINE_ARCH=gfx90a
  - TRANSFORMER_ENGINE_COMMIT=e7835ed
  - TRANSFORMER_ENGINE_REPO=https://github.com/ROCm/TransformerEngine
  export:
    def:
