    \n  rm -rf ${SRC_DIR}/apex;\n\n#\n# Compile and install vLLM\n#\nARG VLLM_COMMIT\n\
    ARG VLLM_REPO\nARG VLLM_VERSION\n\nRUN --mount=type=secret,id=github-netrc,target=/root/.netrc,mode=0600\
    \ \\\n  set -ue; \\\n  export MAX_JOBS=\"${MAX_JOBS:-$(nproc)}\"; \\\n  #\n  git\
    \ clone ${VLLM_REPO} ${SRC_DIR}/vllm; \\\n  cd ${SRC_DIR}/vllm; \\\n  git fetch\
    \ --tags; \\\n  git checkout $VLLM_COMMIT; \\\n  #\n  export MAKEFLAGS=\"-j${MAX_JOBS}\"\
