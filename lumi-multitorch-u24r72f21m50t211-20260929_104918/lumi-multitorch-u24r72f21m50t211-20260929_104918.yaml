    \ https://github.com/orgs/community/discussions/206581#discussioncomment-18269083\n\
    #\nFROM docker.io/alpine/git:2.54.0 AS src\n\nARG SRC_DIR\n\nARG TORCH_REPO\n\
    ARG TORCH_VERSION\nARG TORCH_PATCHES\n\nRUN git config --global advice.detachedHead\
    \ false\n\nRUN --mount=type=secret,id=github-netrc,target=/root/.netrc,mode=0600\
    \ \\\n    set -ue; \\\n    # Get PyTorch\n    mkdir -p ${SRC_DIR}; \\\n    #\n\
    \    git clone --branch \"v${TORCH_VERSION}\" --depth 1 \"${TORCH_REPO}\" \"${SRC_DIR}\"\
    \ && \\\n    cd \"${SRC_DIR}\" && \\\n    git submodule sync --recursive && \\\
    \n    git submodule update --init --recursive; \\\n    #\n    # for PATCH_URL\
    \ in ${TORCH_PATCHES}; do curl -s $PATCH_URL | git apply; done; \\\n    #\n  \
    \  git status\n\nARG BASE_IMAGE\nARG BASE_IMAGE_TAG\n\nFROM $BASE_IMAGE:$BASE_IMAGE_TAG\n\
    \nARG TORCH_APT_DEPENDENCIES\n\nRUN set -ue; \\\n  # Install OS dependencies\n\
    \  apt-get update && \\\n  apt-get -y install --no-install-recommends ${TORCH_APT_DEPENDENCIES}\
    \ && \\\n  apt-get clean && \\\n  rm -rf /var/lib/apt/lists/*\n\nARG TORCH_PIP_DEPENDENCIES\
    \ \\\n    TORCH_ROCM_VERSION \\\n    PYTORCH_TRITON_VERSION\n\nRUN set -ue; \\\
    \n  # Install Python dependencies\n  python3.12 -m venv /opt/venv && \\\n  . /opt/venv/bin/activate;\
    \ \\\n  #\n  pip install ${TORCH_PIP_DEPENDENCIES} && \\\n  pip install \\\n \
    \   triton-rocm==${PYTORCH_TRITON_VERSION} \\\n    --index-url https://download.pytorch.org/whl/${TORCH_ROCM_VERSION}/\
    \ && \\\n  pip install /opt/rocm/share/amd_smi\n\nARG TORCH_GPU_ARCH\nARG TORCH_VERSION\n\
    \nENV PYTORCH_ROCM_ARCH=${TORCH_GPU_ARCH}\n\nARG SRC_DIR\nARG WHEEL_DIR\n\nRUN\
    \ --mount=from=src,source=${SRC_DIR},target=${SRC_DIR},rw \\\n  set -ue; \\\n\
    \  # Build PyTorch\n  export GPU_ARCH_TYPE=rocm; \\\n  export ROCM_HOME=/opt/rocm;\
    \ \\\n  export DESIRED_CUDA=${TORCH_ROCM_VERSION}; \\\n  #\n  export MAX_JOBS=\"\
    $(nproc)\"; \\\n  #\n  export CC=gcc; \\\n  export CXX=g++; \\\n  # Pass the silent\
    \ flag directly to PyTorch's CMake configuration engine\n  export CMAKE_C_FLAGS=\"\
    -w\"; \\\n  export CMAKE_CXX_FLAGS=\"-w\"; \\\n  export CMAKE_CUDA_FLAGS=\"-w\"\
    ; \\\n  #\n  export USE_CUDA=0; \\\n  export USE_XCCL=0; \\\n  export USE_XPU=0;\
    \ \\\n  export USE_ROCM=1; \\\n  # Composable Kernel Enforcements\n  export USE_ROCM_CK_SDPA=0;\
    \ \\\n  export USE_ROCM_CK_GEMM=0; \\\n  #\n  # MPI disabled for PyTorch 2.11.0\
    \ to avoid memory corruption at torch library exit\n  export USE_MPI=0; \\\n \
    \ export USE_C10D_MPI=0; \\\n  export USE_SYSTEM_NCCL=1; \\\n  export USE_STATIC_NCCL=0;\
    \ \\\n  # Flags on official build script\n  # https://github.com/pytorch/pytorch/blob/v2.11.0/.ci/manywheel/build_rocm.sh#L10\n\
    \  #\n  export BUILD_TEST=0; \\\n  export INSTALL_TEST=0; \\\n  #\n  export PYTORCH_BUILD_VERSION=${TORCH_VERSION}+${TORCH_ROCM_VERSION}_lumi_aif_$(date\
    \ -u +'%Y%m%d%H%M%S'); \\\n  export PYTORCH_BUILD_NUMBER=1; \\\n  #\n  . /opt/venv/bin/activate\
    \ && \\\n  mkdir -p ${WHEEL_DIR} && \\\n  cd ${SRC_DIR} && \\\n  pip install -r\
    \ requirements-build.txt && \\\n  python tools/amd_build/build_amd.py && \\\n\
    \  python -m pip wheel --no-build-isolation --no-deps -v -w ${WHEEL_DIR} .; \\\
    \n  #\n  wheel_path=\"$(find ${WHEEL_DIR}  -mindepth 1 -maxdepth 1 -type f -name\
    \ '*.whl')\" && \\\n  test $(echo $wheel_path | wc -w) = 1 && \\\n  cd .. && pip\
    \ install $wheel_path; \\\n  #\n  rm -rf ${WHEEL_DIR}\n\nARG FAKE_TRITON_URL\n\
    ARG TORCHAUDIO_VERSION\nARG TORCHVISION_VERSION\n\nRUN set -e; \\\n  . /opt/venv/bin/activate\
    \ && \\\n  #\n  pip install \\\n    torchvision==${TORCHVISION_VERSION}+${TORCH_ROCM_VERSION}\
    \ \\\n    torchaudio==${TORCHAUDIO_VERSION}+${TORCH_ROCM_VERSION} \\\n    --index-url\
    \ https://download.pytorch.org/whl/${TORCH_ROCM_VERSION} && \\\n  pip install\
    \ ${FAKE_TRITON_URL} && \\\n  python -c \"import torch; print(torch.__version__)\"\
    ; \\\n  #\n  # Add SBOM\n  #\n  apt_json=\"$(dpkg-query -W -f='${Package}\\t${Version}\\\
    n' | jq -R -s 'split(\"\\n\")[:-1] | map(split(\"\\t\") | {name: .[0], version:\
    \ .[1]})')\" && \\\n  pip_json=\"$(pip list --format=json)\" && \\\n  jq -n \\\
    \n    --argjson apt \"$apt_json\" \\\n    --argjson pip \"$pip_json\" \\\n   \
    \ '{apt: $apt, pip: $pip}' > /.sbom.json\n\n# force all RCCL streams to be high\
    \ priority\nENV TORCH_NCCL_HIGH_PRIORITY=1\n\nENV VIRTUAL_ENV=\"/opt/venv\"\n\
    ENV PATH=\"/opt/venv/bin:$PATH\"\nENV PYTHONPATH=\"/opt/venv/lib/python3.12/site-packages:$PYTHONPATH\"\
    \n\nRUN printf '#!/usr/bin/env bash\\n\\\nif [ \"${SLURM_NNODES}\" = 1 ] && [\
    \ -z \"${SLURM_GPUS_ON_NODE}\" ]; then\\n\\\n    export FI_HMEM_DISABLE_P2P=1\\\
    n\\\nfi\\n\\\nexec \"$@\"\\n' > /opt/oci-entrypoint.sh && chmod +x /opt/oci-entrypoint.sh\n\
    \nENTRYPOINT [\"/opt/oci-entrypoint.sh\"]\n"

