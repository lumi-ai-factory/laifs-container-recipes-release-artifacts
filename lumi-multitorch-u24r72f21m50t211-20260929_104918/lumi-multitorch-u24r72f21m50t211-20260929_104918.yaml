- name: lumi-multitorch-u24r72f21m50t211-20260929_104918.md
  content: "# LUMI AI Factory Container Image Collection lumi-multitorch-u24r72f21m50t211\
    \ release 20260929_104918\n\n**Release Links:**\n- [GitHub Release](https://github.com/lumi-ai-factory/laifs-container-recipes/releases/tag/lumi-multitorch-u24r72f21m50t211-20260929_104918)\n\
    - [Known Issues](https://github.com/lumi-ai-factory/laifs-container-recipes/issues?q=label%3Alumi-multitorch-u24r72f21m50t211-20260929_104918)\n\
    \n**Related Links:**\n- [LUMI AI Factory](https://lumi-ai-factory.eu/)\n- [LUMI\
    \ Supercomputer](https://lumi-supercomputer.eu/)\n- [GitHub Repository](https://github.com/lumi-ai-factory/laifs-container-recipes)\n\
    - [GitHub Releases](https://github.com/lumi-ai-factory/laifs-container-recipes/releases)\n\
    - [Docker Hub](https://hub.docker.com/u/lumiaifactory)\n\n## Overview\n\nThis\
    \ collection of container images is developed by the LUMI AI Factory and is\n\
    specifically designed for use on the LUMI supercomputer. The images are built\n\
    using recipes available in the LUMI AI Factory GitHub repository. Each image of\n\
    the release builds on the previous one by adding new features, finally resulting\n\
    in a fully featured, GPU-enabled and MPI-capable PyTorch-based multipurpose\n\
    ML/AI container image.\n\nAll build artifacts are publicly available. This includes\
    \ the full recipe,\nContainerfiles, build logs, and the resulting final container\
    \ images. This\ntransparent approach enables full customization for special use\
    \ cases, reuse\non other similar systems, as well as adapting the images to run\
    \ on cloud\nenvironments.\n\nAll images are published to Docker Hub, and ready-to-run\
    \ Singularity Image Format\n(SIF) versions of the images are available directly\
    \ on LUMI. The generated\nContainerfiles and other artifacts are released as public\
    \ GitHub releases.\n\nThe release identifier `lumi-multitorch-u24r72f21m50t211-20260929_104918`\
    \ encodes\nthe following information:\n  - lumi: The primary target system for\
    \ the images (LUMI)\n  - multitorch: Image type (a multipurpose PyTorch image)\n\
    \  - u24r72f21m50t211: Major software versions digest, consisting of:\n    - u24:\
    \ Digest from Ubuntu 24.04 LTS\n    - r72: Digest from ROCm 7.2.4\n    - f21:\
    \ Digest from libfabric 2.1\n    - m50: Digest from MPICH 5.0.1\n    - t211: Digest\
    \ from PyTorch 2.11.0\n  - 20260929_104918: Timestamp-based build tag\n\nThis\
    \ release includes six images, each building on the previous one by adding\nnew\
    \ major functionality in the following order:\n  - `lumi-multitorch-rocm-u24r72f21m50t211`:\
    \ Starts from Ubuntu base image and adds ROCm 7.2.4\n  - `lumi-multitorch-libfabric-u24r72f21m50t211`:\
    \ Adds libfabric 2.1 to the ROCm image\n  - `lumi-multitorch-mpich-u24r72f21m50t211`:\
    \ Adds MPICH 5.0.1 with GPU support to the libfabric image\n  - `lumi-multitorch-torch-u24r72f21m50t211`:\
    \ Adds PyTorch 2.11.0 to the MPICH image\n  - `lumi-multitorch-full-u24r72f21m50t211`:\
    \ Adds selection of AI and ML libraries to the PyTorch image\n  - `lumi-multitorch-plus-u24r72f21m50t211`:\
    \ Adds experimental software to the Full image\n\nThe final image, `lumi-multitorch-full-u24r72f21m50t211-20260929_104918`,\n\
    includes these key software components:\n  - Ubuntu 24.04 LTS (from https://hub.docker.com/layers/library/ubuntu/noble-20260911)\n\
    \  - AMD ROCm 7.2.4 (from https://repo.radeon.com/rocm)\n  - Xpmem (from https://github.com/hpc/xpmem\
    \ commit 3bcab55)\n  - Cassini headers (from https://github.com/HewlettPackard/shs-cassini-headers\
    \ release tgz for 12.0.1)\n  - CXI headers (from https://github.com/HewlettPackard/shs-cxi-driver\
    \ commit 27f7be5)\n  - Libcxi (from https://github.com/HewlettPackard/shs-libcxi\
    \ commit 30fa2dd)\n  - Libfabric 2.1 (from https://github.com/ofiwg/libfabric\
    \ commit 78d6e03)\n  - MPICH 5.0.1 (from http://www.mpich.org/static/downloads\
    \ release tgz for 5.0.1)\n  - AWS-OFI-NCCL 1.21.1 (from https://github.com/aws/aws-ofi-nccl\
    \ commit 2475c4c)\n  - RCCL (from https://github.com/ROCm/rocm-systems commit\
    \ 485afdf)\n  - OSU micro-benchmarks 7.5.2 (from https://mvapich.cse.ohio-state.edu/download/mvapich\
    \ release tgz for 7.5.2)\n  - PyTorch 2.11.0 (from https://github.com/pytorch/pytorch\
    \ tag v2.11.0)\n  - TorchVision (from https://download.pytorch.org/whl/rocm7.2)\n\
    \  - TorchAudio (from https://download.pytorch.org/whl/rocm7.2)\n  - PyTorch Triton\
    \ (from https://download.pytorch.org/whl/rocm7.2)\n  - Apex (from https://github.com/ROCm/apex\
    \ commit c0f56f7)\n  - Causal Conv1D (from https://github.com/Dao-AILab/causal-conv1d\
    \ commit 4f6ae4e)\n  - DeepSpeed 0.19.6 (with locally built ops addons)\n  - Flash\
    \ Attention (from https://github.com/ROCm/flash-attention commit b664ea0)\n  -\
    \ LLM Compressor: (from https://github.com/vllm-project/llm-compressor commit\
    \ 6d2a090)\n  - Megatron LM (experimental): (from https://github.com/ROCm/Megatron-LM\
    \ commit 9784f40)\n  - vLLM v0.26.0 (from https://github.com/vllm-project/vllm\
    \ commit 568afb3)\n  - xFormers (from https://github.com/facebookresearch/xformers\
    \ commit 03b91d7)\n\nThese additional packages from PyPI are also included in\
    \ the final image:\n  - accelerate\n  - bitsandbytes\n  - datasets\n  - evaluate\n\
    \  - h5py\n  - huggingface-hub\n  - jupyter\n  - lightning\n  - marimo\n  - matplotlib\n\
    \  - mlflow\n  - mpi4py\n  - numba\n  - pandas\n  - peft\n  - scipy\n  - sentence-transformers\n\
    \  - sentencepiece\n  - tensorboard\n  - trl\n  - ultralytics-opencv-headless\n\
    \nThe experimental image lumi-multitorch-plus-u24r72f21m50t211-20260929_104918\n\
    builds on the full image by introducing experimental software additions and\n\
    potentially breaking changes. It is not intended for production use, but rather\n\
    as a testing ground for evaluating potential future additions and for hosting\n\
    software with breaking dependencies or other limitations. See the image\ndescription\
    \ below.\n\nDocumentation for each image is provided separately in the `<image\
    \ name>.md`\nMarkdown text files, as well as in the next sections of this file.\
    \ A Software\nBill of Materials (SBOM) with full software version numbers is available\
    \ for\neach image in files named `<image name>.json`. These files list all Ubuntu\
    \ and\nPython packages used in the images. Containerfiles and build logs for each\
    \ image\nare available in files named <image name>.Containerfile` and `<image\
    \ name>.log`.\n\nAll software in the images is installed as either Python or Ubuntu\
    \ packages.\nSome packages are installed directly from Ubuntu repositories, some\
    \ from PyPI,\nand others such as PyTorch and ROCm, are installed from external\
    \ upstream\npackage repositories (PyTorch project's repository, AMD's ROCm repository).\n\
    Lastly, the remaining packages are built locally during the container build\n\
    process and then installed as either Ubuntu or Python packages, resulting in\n\
    all included software being managed by either Ubuntu or Python package managers.\n\
    \nThe GitHub release for this build consists of:\n  - A `.yaml` recipe file which\
    \ defines the build steps, software versions, and\n    includes all required Containerfiles\
    \ and documentation snippets to reproduce\n    the build of this release.\n  -\
    \ Containerfiles (`.Containerfile`)\n    for convenience (this data is embedded\
    \ in the `.yaml` recipe as well).\n  - This release README file and separate per-image\
    \ documentation (`.md`).\n  - Build logs (`.log`) and SBOM files (`.json`) for\
    \ all images for\n    transparency.\n\nThe images are available for direct use\
    \ on LUMI:\n  - Path to this exact release on LUMI is:\n    `/appl/local/laifs/containers/lumi-multitorch-u24r72f21m50t211-20260929_104918`\n\
    \  - Latest build with the same software digest as this release is symlinked at:\n\
    \    `/appl/local/laifs/containers/lumi-multitorch-u24r72f21m50t211`\n  - Latest\
    \ version (over all digests) is symlinked at:\n    `/appl/local/laifs/containers/lumi-multitorch`\n\
    \  - Example listing of release directory content on LUMI:\n    - `lumi-multitorch-u24r72f21m50t211-20260929_104918.md`:\
    \ The main readme file\n    - `lumi-multitorch-u24r72f21m50t211-20260929_104918.yaml`:\
    \ The recipe file\n    - `lumi-multitorch-plus-u24r72f21m50t211-20260929_104918.sif`:\
    \ SIF image for the plus image\n    - `lumi-multitorch-plus-u24r72f21m50t211-20260929_104918.md`:\
    \ Readme file for the plus image\n    - `lumi-multitorch-plus-u24r72f21m50t211-20260929_104918.json`:\
    \ Software Bill of materials for the plus image\n    - `lumi-multitorch-full-u24r72f21m50t211-20260929_104918.sif`:\
    \ SIF image for the full image\n    - `lumi-multitorch-full-u24r72f21m50t211-20260929_104918.md`:\
    \ Readme file for the full image\n    - `lumi-multitorch-full-u24r72f21m50t211-20260929_104918.json`:\
    \ Software Bill of materials for the full image\n    - `lumi-multitorch-torch-u24r72f21m50t211-20260929_104918.sif`:\
    \ SIF image for the torch image\n    - `lumi-multitorch-torch-u24r72f21m50t211-20260929_104918.md`:\
    \ Readme file for the torch image\n    - `lumi-multitorch-torch-u24r72f21m50t211-20260929_104918.json`:\
    \ Software Bill of materials for the torch image\n    - `lumi-multitorch-mpich-u24r72f21m50t211-20260929_104918.sif`:\
    \ SIF image for the mpich image\n    - `lumi-multitorch-mpich-u24r72f21m50t211-20260929_104918.md`:\
    \ Readme file for the mpich image\n    - `lumi-multitorch-mpich-u24r72f21m50t211-20260929_104918.json`:\
    \ Software Bill of materials for the mpich image\n    - `lumi-multitorch-libfabric-u24r72f21m50t211-20260929_104918.sif`:\
    \ SIF image for the libfabric image\n    - `lumi-multitorch-libfabric-u24r72f21m50t211-20260929_104918.md`:\
    \ Readme file for the libfabric image\n    - `lumi-multitorch-libfabric-u24r72f21m50t211-20260929_104918.json`:\
    \ Software Bill of materials for the libfabric image\n    - `lumi-multitorch-rocm-u24r72f21m50t211-20260929_104918.sif`:\
    \ SIF image for the rocm image\n    - `lumi-multitorch-rocm-u24r72f21m50t211-20260929_104918.md`:\
    \ Readme file for the rocm image\n    - `lumi-multitorch-rocm-u24r72f21m50t211-20260929_104918.json`:\
    \ Software Bill of materials for the rocm image\n    \nIllustrative example use\
    \ on LUMI:\n  ```\n  uan:~> srun --gpus-per-task=2 <other srun args> singularity\
    \ \\\n    run <singularity args> <path to sif image> \\\n      python -c 'import\
    \ torch; print(\"num gpus:\", torch.cuda.device_count())'\n  [...]\n  num gpus:\
    \ 2\n  ```\n\nOn Docker Hub the images are available with the following tag/naming\
    \ scheme:\n  - The exact images from this recipe build:\n    - Image plus: `lumiaifactory/lumi-multitorch:plus-u24r72f21m50t211-20260929_104918`\n\
    \    - Image full: `lumiaifactory/lumi-multitorch:full-u24r72f21m50t211-20260929_104918`\n\
    \    - Image torch: `lumiaifactory/lumi-multitorch:torch-u24r72f21m50t211-20260929_104918`\n\
    \    - Image mpich: `lumiaifactory/lumi-multitorch:mpich-u24r72f21m50t211-20260929_104918`\n\
    \    - Image libfabric: `lumiaifactory/lumi-multitorch:libfabric-u24r72f21m50t211-20260929_104918`\n\
    \    - Image rocm: `lumiaifactory/lumi-multitorch:rocm-u24r72f21m50t211-20260929_104918`\n\
    \  - Latest build with specific significant software versions (using software\
    \ digest):\n    - Image plus:  `lumiaifactory/lumi-multitorch:plus-u24r72f21m50t211`\n\
    \    - Image full:  `lumiaifactory/lumi-multitorch:full-u24r72f21m50t211`\n  \
    \  - Image torch:  `lumiaifactory/lumi-multitorch:torch-u24r72f21m50t211`\n  \
    \  - Image mpich:  `lumiaifactory/lumi-multitorch:mpich-u24r72f21m50t211`\n  \
    \  - Image libfabric:  `lumiaifactory/lumi-multitorch:libfabric-u24r72f21m50t211`\n\
    \    - Image rocm:  `lumiaifactory/lumi-multitorch:rocm-u24r72f21m50t211`\n  -\
    \ Floating tags for latest version (over any significant software versions / digests):\n\
    \    - `lumiaifactory/lumi-multitorch:plus`: latest complete plus image across\
    \ all variants\n    - `lumiaifactory/lumi-multitorch:full`: latest complete full\
    \ image across all variants\n    - `lumiaifactory/lumi-multitorch:torch`: latest\
    \ complete torch image across all variants\n    - `lumiaifactory/lumi-multitorch:mpich`:\
    \ latest complete mpich image across all variants\n    - `lumiaifactory/lumi-multitorch:libfabric`:\
    \ latest complete libfabric image across all variants\n    - `lumiaifactory/lumi-multitorch:rocm`:\
    \ latest complete rocm image across all variants\n  - Example Docker Hub pull\
    \ commands:\n    - `docker pull lumiaifactory/lumi-multitorch:full-u24r72f21m50t211-20260929_104918`\n\
    \    - `docker pull lumiaifactory/lumi-multitorch:torch-u24r72f21m50t211`\n  \
    \  - `docker pull lumiaifactory/lumi-multitorch:rocm`\n\n\n## Included Images\n\
    \nThe next sections describe each included image in detail. For\nconvenience,\
    \ this documentation is also available separately for\neach image in the per image\
    \ Markdown (`.md`) files.\n\n### Image lumi-multitorch-rocm-u24r72f21m50t211-20260929_104918\n\
    \n**Overview**\nThis is a base image building on Ubuntu 24.04 LTS upstream image\n\
    with ROCm software from AMD's official Ubuntu repositories installed on top of\n\
    it. The image also adds a few commonly used extra Ubuntu packages and enables\n\
    man pages.\n\n**Details**\nUbuntu base image: ubuntu:noble-20260911\nAMD ROCm\
    \ repository: https://repo.radeon.com/rocm\nAMD ROCm release: 7.2.4\nAdditional\
    \ Ubuntu packages:\n  - file\n  - git\n  - jq\n  - less\n  - libdw1t64\n  - lsof\n\
    \  - nano\n  - neovim\n  - python3-dev\n  - python3-packaging\n  - python3-pip\n\
    \  - python3-venv\n  - screen\n  - tmux\n  - unzip\n  - wget\n\n\n### Image lumi-multitorch-libfabric-u24r72f21m50t211-20260929_104918\n\
    \n**Overview**\nThis image builds on top of its base image by adding locally built\
    \ Ubuntu\npackages to enable xpmem as well as libfabric functionality for HPE's\
    \ Slingshot\ninterconnect. It serves as a starting point for adding MPI capability\
    \ to images\nbuilt on top of it and can be a useful foundation for creating images\
    \ with\ncustom MPI stacks.\n\n**Details**\nBase image: lumi-multitorch-rocm-u24r72f21m50t211\n\
    Components:\n  - xpmem (from https://github.com/hpc/xpmem commit 3bcab55)\n  -\
    \ Cassini headers (from https://github.com/HewlettPackard/shs-cassini-headers\
    \ release tgz for 12.0.1)\n  - CXI headers (from https://github.com/HewlettPackard/shs-cxi-driver\
    \ commit 27f7be5)\n  - libcxi (from https://github.com/HewlettPackard/shs-libcxi\
    \ commit 30fa2dd)\n  - Libfabric 2.1 (from https://github.com/ofiwg/libfabric\
    \ commit 78d6e03)\n\n\n### Image lumi-multitorch-mpich-u24r72f21m50t211-20260929_104918\n\
    \n**Overview**\nThis image builds on top of its base image by adding an MPI library\
    \ with GPU\nsupport, based on an MPICH build. It also includes the AWS-OFI-NCCL\
    \ plugin to\nenable RCCL communication over the interconnect network using libfabric.\
    \ The\nrccl-tests and OSU micro-benchmarks suite are included for performance\
    \ and\nfunctionality validation.\n\n**Details**\nBase image: lumi-multitorch-libfabric-u24r72f21m50t211\n\
    MPI implementation: MPICH 5.0.1\nComponents:\n  - MPICH 5.0.1 (from http://www.mpich.org/static/downloads\
    \ release tgz for 5.0.1)\n  - AWS-OFI-NCCL 1.21.1 (from https://github.com/aws/aws-ofi-nccl\
    \ commit 2475c4c)\n  - RCCL Tests (from https://github.com/ROCm/rocm-systems commit\
    \ 485afdf)\n  - OSU micro-benchmarks 7.5.2 (from https://mvapich.cse.ohio-state.edu/download/mvapich\
    \ release tgz for 7.5.2)\n\n\n### Image lumi-multitorch-torch-u24r72f21m50t211-20260929_104918\n\
    \n**Overview**\nThis image builds on top of its base image by adding PyTorch for\
    \ AMD GPUs and\nROCm, along with few related packages from PyTorch's upstream\
    \ repositories.\n\n**Details**\nBase image: lumi-multitorch-mpich-u24r72f21m50t211\n\
    PyTorch version: 2.11.0\nPyTorch packages and sources:\n  - PyTorch: \"https://github.com/pytorch/pytorch\
    \ @ tag v2.11.0\"\n  - TorchVision: 0.26.0 from https://download.pytorch.org/whl/rocm7.2/\n\
    \  - TorchAudio: 2.11.0 from https://download.pytorch.org/whl/rocm7.2/\n  - PyTorch\
    \ Triton: 3.6.0 from https://download.pytorch.org/whl/rocm7.2/\n\n\n### Image\
    \ lumi-multitorch-full-u24r72f21m50t211-20260929_104918\n\n**Overview**\nThis\
    \ is a multipurpose ML/AI image that builds on its base image by adding a\ncomprehensive\
    \ selection of tools and libraries for machine learning and AI\nworkloads. The\
    \ image is optimized to run on LUMI but should also work on other\nsystems with\
    \ MI250x GPUs and Slingshot interconnect.\n\n**Details**\nBase image: lumi-multitorch-torch-u24r72f21m50t211\n\
    GPU architectures: gfx90a\nComponents:\n  - Apex (from https://github.com/ROCm/apex\
