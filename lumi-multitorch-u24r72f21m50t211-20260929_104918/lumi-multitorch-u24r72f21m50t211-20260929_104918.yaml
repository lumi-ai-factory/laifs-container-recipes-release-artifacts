      - LLM Compressor (from https://github.com/vllm-project/llm-compressor commit 6d2a090)
      - Megatron LM (experimental) (from https://github.com/ROCm/Megatron-LM commit 9784f40)
      - vLLM v0.26.0 (from https://github.com/vllm-project/vllm commit 568afb3)
      - xFormers (from https://github.com/facebookresearch/xformers commit 03b91d7)

