    \ --no-build-isolation -v -w ${SRC_DIR}/apex/dist .; \\\n  wheel_path=\"$(find\
    \ ${SRC_DIR}/apex/dist  -mindepth 1 -maxdepth 1 -type f -name '*.whl')\"; \\\n\
    \  test $(echo $wheel_path | wc -w) = 1; \\\n  new_wheel=\"$(wretag -d -q lumi_aif_${MULTI_IMAGE_GPU_ARCH}_${APEX_GIT_COMMIT}\
